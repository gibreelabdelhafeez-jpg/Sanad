 64":"Et Il est le Plus Miséricordieux des miséricordieux.","البقرة: 153":"Certes, Allah est avec les patients.","الشرح: 1":"N’avons-Nous pas ouvert ta poitrine pour toi ?","طه: 25-26":"Mon Seigneur, ouvre-moi ma poitrine et facilite-moi ma tâche.","الكهف: 10":"Notre Seigneur, accorde-nous une miséricorde de Ta part et dispose pour nous une bonne direction dans notre affaire.","التوبة: 40":"Ne t’attriste pas, Allah est avec nous.","البقرة: 216":"Il se peut que vous détestiez une chose alors qu’elle est un bien pour vous.","الطلاق: 3":"Quiconque s’en remet à Allah, Il lui suffit.","الأنعام: 59":"C’est auprès de Lui que sont les clés de l’invisible ; nul ne les connaît hormis Lui.","هود: 6":"Il n’est aucune créature sur terre dont la subsistance n’incombe à Allah.","الطلاق: 1":"Tu ne sais pas ; peut-être qu’Allah fera naître ensuite quelque chose de nouveau.","التوبة: 51":"Dis : Rien ne nous atteindra, sauf ce qu’Allah a décrété pour nous ; Il est notre Protecteur.","هود: 88":"Et mon succès ne dépend que d’Allah.","الإسراء: 31":"C’est Nous qui pourvoyons à leur subsistance et à la vôtre.","يوسف: 100":"Mon Seigneur est Subtil dans ce qu’Il veut.","طه: 73":"Et Allah est meilleur et plus durable.","الزمر: 36":"Allah ne suffit-Il pas à Son serviteur ?","هود: 123":"À Allah appartient l’invisible des cieux et de la terre, et c’est vers Lui que toute chose est ramenée.","آل عمران: 159":"Puis, quand tu as pris ta décision, remets-toi à Allah.","يوسف: 87":"Et ne désespérez pas du soulagement d’Allah.","النساء: 81":"Allah suffit comme garant.","الفرقان: 58":"Et place ta confiance dans le Vivant qui ne meurt pas.","القصص: 13":"Nous l’avons donc rendu à sa mère, afin que son œil se réjouisse et qu’elle ne s’afflige plus.","إبراهيم: 37":"Notre Seigneur, j’ai établi une partie de ma descendance dans une vallée sans culture.","يوسف: 86":"Je n’expose ma détresse et ma tristesse qu’à Allah.","آل عمران: 139":"Ne vous affaiblissez pas et ne vous attristez pas : vous aurez le dessus si vous êtes croyants.","الضحى: 3":"Ton Seigneur ne t’a ni abandonné ni détesté.","الضحى: 5":"Et ton Seigneur te donnera bientôt de quoi te satisfaire.","البقرة: 155":"Et annonce la bonne nouvelle aux patients.","الشرح: 6":"Certes, avec la difficulté vient la facilité.","الطور: 48":"Sois patient face à la décision de ton Seigneur, car tu es sous Nos yeux.","الشورى: 28":"C’est Lui qui fait descendre la pluie après qu’ils ont désespéré.","البقرة: 186":"Je suis proche : j’exauce l’appel de celui qui M’invoque lorsqu’il M’invoque.","الحجر: 97":"Nous savons que ta poitrine se serre à cause de ce qu’ils disent.","الحجر: 98":"Glorifie donc ton Seigneur par Sa louange et sois parmi ceux qui se prosternent.","النمل: 70":"Ne t’afflige pas pour eux, et ne sois pas angoissé par leurs ruses.","الأنبياء: 83":"Le malheur m’a touché, et Tu es le Plus Miséricordieux des miséricordieux.","الأنبياء: 87":"Pas de divinité en dehors de Toi ! Gloire à Toi ! J’ai été du nombre des injustes.","مريم: 24":"Ne t’attriste pas : ton Seigneur a placé à tes pieds un ruisseau.","الزمر: 53":"Dis : Ô Mes serviteurs qui avez commis des excès contre vous-mêmes, ne désespérez pas de la miséricorde d’Allah.","البقرة: 222":"Certes, Allah aime ceux qui se repentent et ceux qui se purifient.","الشورى: 25":"C’est Lui qui accepte le repentir de Ses serviteurs.","هود: 61":"Mon Seigneur est proche et exauce.","النساء: 110":"Quiconque commet un mal ou se fait du tort, puis demande pardon à Allah, trouvera Allah Pardonneur et Miséricordieux.","هود: 114":"Les bonnes actions effacent les mauvaises.","آل عمران: 135":"Ceux qui, ayant commis une turpitude ou s’étant fait du tort, évoquent Allah et demandent pardon pour leurs péchés.","الفرقان: 70":"Ceux-là, Allah remplacera leurs mauvaises actions par de bonnes.","النور: 31":"Et repentez-vous tous devant Allah, ô croyants, afin que vous réussissiez.","النجم: 39":"Et l’homme n’a que ce pour quoi il s’est efforcé.","التوبة: 105":"Et dis : Agissez ! Allah verra vos actions.","العنكبوت: 69":"Et ceux qui luttent pour Nous, Nous les guiderons certes vers Nos chemins.","البقرة: 148":"Hâtez-vous donc vers les bonnes œuvres.","الزلزلة: 7":"Quiconque fait le poids d’un atome de bien le verra.","الأعراف: 23":"Notre Seigneur, nous nous sommes fait du tort ; si Tu ne nous pardonnes pas et ne nous fais pas miséricorde, nous serons certes parmi les perdants.","التوبة: 120":"Certes, Allah ne laisse pas perdre la récompense de ceux qui font le bien.","الليل: 4":"Vos efforts sont certes divers.","الأنبياء: 94":"Quiconque accomplit de bonnes œuvres tout en étant croyant, son effort ne sera pas méconnu.","هود: 112":"Reste donc droit, comme il t’a été ordonné.","طه: 14":"Et accomplis la prière pour M’invoquer.","طه: 114":"Et dis : Mon Seigneur, augmente-moi en science.","نوح: 5":"Il dit : Mon Seigneur, j’ai appelé mon peuple nuit et jour.","الشعراء: 62":"Il dit : Jamais ! Mon Seigneur est avec moi ; Il me guidera.","إبراهيم: 7":"Si vous êtes reconnaissants, Je vous donnerai davantage.","البقرة: 152":"Souvenez-vous de Moi, Je me souviendrai de vous ; remerciez-Moi et ne soyez pas ingrats.","سبأ: 13":"Œuvrez, famille de David, en remerciement ; et rares sont Mes serviteurs reconnaissants.","إبراهيم: 34":"Si vous comptiez les bienfaits d’Allah, vous ne pourriez les dénombrer.","النحل: 53":"Tout bienfait dont vous jouissez vient d’Allah.","الضحى: 11":"Et quant au bienfait de ton Seigneur, proclame-le.","آل عمران: 144":"Et Allah récompensera les reconnaissants.","البقرة: 243":"Allah est certes plein de bonté envers les gens, mais la plupart des gens ne sont pas reconnaissants.","سبأ: 15":"Mangez de ce que votre Seigneur vous a accordé et remerciez-Le.","النحل: 114":"Et remerciez Allah pour Son bienfait, si c’est Lui que vous adorez.","إبراهيم: 5":"Il y a en cela des signes pour quiconque est patient et reconnaissant.","لقمان: 12":"Nous avons donné la sagesse à Luqmân : « Sois reconnaissant envers Allah. » Quiconque est reconnaissant l’est pour lui-même.","المؤمنون: 78":"C’est Lui qui a créé pour vous l’ouïe, la vue et les cœurs ; combien peu vous remerciez.","النمل: 19":"Mon Seigneur, inspire-moi de Te remercier pour Ton bienfait dont Tu m’as comblé, ainsi que mes parents, et d’accomplir une bonne œuvre qui Te plaise.","النمل: 15":"Louange à Allah qui nous a favorisés par rapport à beaucoup de Ses serviteurs croyants."},"s":[[["Moïse (paix sur lui) face à une mission difficile","Lorsque Moïse fut chargé d’affronter Pharaon, il demanda à Allah d’ouvrir sa poitrine et de faciliter sa tâche.","Même quand la mission dépasse ce que tu imaginais, commence par demander l’aide d’Allah."],["Les gens de la Caverne","De jeunes hommes firent face à une dure réalité et à une forte pression ; ils se tournèrent vers Allah et Lui demandèrent miséricorde et bonne direction.","Quand tu ne connais pas le chemin, demande à Allah de te le montrer."],["Le Prophète ﷺ dans la grotte","Le Prophète ﷺ et Abou Bakr (qu’Allah l’agrée) étaient dans la grotte, le danger tout proche, et le Prophète ﷺ le rassura.","Les circonstances peuvent se resserrer, mais la compagnie d’Allah est plus grande que tout ce que tu crains."],["Circonstance de la révélation : « Allah n’impose à aucune âme que ce qu’elle peut supporter »","Quand fut révélé le verset « Que vous divulguiez ce qui est en vous ou que vous le cachiez, Allah vous en demandera compte », cela pesa lourd sur les Compagnons, qui vinrent dire au Prophète ﷺ qu’ils ne pouvaient le supporter. Allah révéla alors « Allah n’impose à aucune âme que ce qu’elle peut supporter » pour les soulager. (Muslim)","Allah ne te charge jamais au-delà de tes forces."]],[["Joseph (paix sur lui) : un avenir inattendu","Joseph fut jeté dans le puits, puis vendu, puis emprisonné. Mais l’histoire ne s’est pas arrêtée là : il devint ministre d’Égypte et retrouva sa famille après des années de séparation. (Sourate Yousouf)","Ne juge pas ton avenir à partir de ton présent ; des événements dont tu ne vois pas la sagesse aujourd’hui font peut-être partie d’un chemin que tu n’imaginais pas."],["La mère de Moïse","Elle déposa son enfant dans un coffre et le jeta au fleuve sur l’ordre d’Allah, malgré l’apparence effrayante de la situation, et Allah le lui rendit.","Le plan d’Allah pour toi dépasse peut-être ta capacité à imaginer une issue."],["Abraham (paix sur lui)","Abraham laissa sa famille dans une vallée sans culture et se tourna vers Allah par l’invocation.","Quand tu ne maîtrises pas les circonstances, tu peux toujours invoquer."],["Le Prophète ﷺ et Abou Bakr dans la grotte","Les polythéistes se tenaient à l’entrée de la grotte et Abou Bakr dit : « S’il regardait ses pieds, l’un d’eux nous verrait ! » Le Prophète ﷺ répondit : « Que penses-tu de deux dont Allah est le troisième ? » (Boukhari)","La certitude en Allah transforme la peur en calme."]],[["Jacob (paix sur lui) : un chagrin qui n’éteint pas l’espoir","Jacob perdit son fils Joseph et son chagrin devint si lourd que ses yeux blanchirent, sans qu’il perde jamais sa confiance en Allah.","Tu n’as pas à faire semblant d’être fort en permanence ; tu peux confier ta peine à Allah."],["Job (paix sur lui) : quand l’épreuve dure","Job fut éprouvé mais resta attaché à son Seigneur ; Allah l’exauça et écarta son mal.","Une longue épreuve ne signifie pas l’absence de la miséricorde d’Allah."],["Jonas (paix sur lui) : dans trois ténèbres","Jonas se trouvait dans les ténèbres de la mer, de la nuit et du ventre de la baleine, sans jamais perdre la porte de l’invocation.","Même au plus profond de la tristesse, la porte d’Allah reste ouverte."],["Marie (paix sur elle)","Quand les douleurs de l’enfantement l’accablèrent et qu’elle se trouva dans une situation très dure, un réconfort divin lui vint.","La miséricorde peut venir au moment même où tu te crois seul."],["Circonstance de la révélation : sourate Ad-Douha","Le Prophète ﷺ tomba malade et ne pria pas la nuit pendant une ou deux nuits. Une femme vint dire : « Muhammad, je crois que ton démon t’a quitté ! » Allah révéla alors : « Par le jour naissant et par la nuit quand elle s’apaise, ton Seigneur ne t’a ni abandonné ni détesté. » (Convenu)","Ton Seigneur ne t’a pas quitté et ne te quittera pas."]],[["Adam (paix sur lui) : l’erreur n’est pas la fin du chemin","Quand Adam fit un faux pas, il ne persista pas dans l’éloignement ; il se repentit devant Allah.","Reconnaître son erreur et revenir à Allah est un nouveau départ."],["Ka‘b ibn Mâlik (qu’Allah l’agrée)","Ka‘b resta en arrière de l’expédition de Tabouk sans excuse, puis dit la vérité au Prophète ﷺ sans chercher de prétextes. Il traversa une épreuve sévère jusqu’à ce qu’Allah accepte son repentir. (Sourate At-Tawba 117-119 ; Boukhari et Muslim)","Ne traite pas ton manquement en le niant ; affronte-le avec sincérité, action et repentir."],["L’homme qui avait tué cent personnes","Un homme tua quatre-vingt-dix-neuf personnes, demanda s’il pouvait se repentir, puis compléta la centaine. Pourtant il ne désespéra pas de la miséricorde d’Allah ; il se mit en route vers le repentir et les anges prirent son âme en chemin. (Boukhari et Muslim)","Aussi loin qu’on soit allé, on ne doit pas fermer sur soi la porte du retour."],["Circonstance de la révélation : « Dis : Ô Mes serviteurs qui avez commis des excès »","Des gens qui avaient beaucoup péché avant l’islam demandèrent au Prophète ﷺ s’ils pouvaient encore se repentir ; ce verset est descendu et leur a ouvert la porte de l’espoir. (Boukhari)","La miséricorde d’Allah est plus vaste que tout péché."]],[["Noé (paix sur lui) : persévérer sur une longue route","Il appela son peuple nuit et jour et continua pendant très longtemps.","Tout effort ne porte pas ses fruits rapidement, et tout succès ne vient pas du premier essai."],["Moïse (paix sur lui) : de la peur à l’affrontement","Moïse craignait d’affronter Pharaon, pourtant il avança en s’appuyant sur Allah.","Le courage n’est pas l’absence de peur, mais avancer en demandant l’aide d’Allah."],["Dhoul-Qarnayn : agir et prendre les moyens","Face au problème de Gog et Magog, il ne s’est pas contenté d’invoquer ; il a agi, pris les moyens et utilisé les ressources disponibles. (Al-Kahf 83-98)","S’en remettre à Allah ne veut pas dire attendre le changement sans agir."]],[["Salomon (paix sur lui) et la fourmi","Quand Salomon entendit la fourmi avertir les siens, il prit conscience du bienfait d’Allah sur lui et invoqua son Seigneur.","Plus tes bienfaits augmentent, plus tu as besoin de gratitude."],["David et Salomon (paix sur eux)","Allah leur accorda science, royauté et puissance, et pourtant ils savaient que tout le mérite revient à Allah.","Le vrai succès est d’attribuer le mérite à Celui à qui il revient."],["Le Prophète ﷺ et la prière de la nuit","Le Prophète ﷺ priait la nuit jusqu’à ce que ses pieds enflent. On lui dit : « Fais-tu cela alors qu’Allah t’a pardonné tes péchés passés et futurs ? » Il répondit : « Ne serai-je pas un serviteur reconnaissant ? » (Convenu)","La gratitude n’est pas que des mots ; elle se voit dans l’action et l’adoration."]]],"d":[["Ô Allah, je cherche refuge auprès de Toi contre le souci et le chagrin, l’impuissance et la paresse, la lâcheté et l’avarice, l’accablement de la dette et la domination des hommes.","Mon Seigneur, ouvre-moi la poitrine et facilite-moi ma tâche.","Ô Allah, aide-moi et ne m’oppose pas d’aide contre moi ; soutiens-moi et ne soutiens pas d’autres contre moi ; guide-moi et rends la guidée facile pour moi.","Ô Vivant, ô Subsistant, c’est par Ta miséricorde que je cherche secours ; arrange toutes mes affaires et ne me laisse pas à moi-même, ne serait-ce que le temps d’un clin d’œil.","Ô Allah, je Te demande le repos du cœur, la sérénité de l’âme, la bénédiction du temps et la facilité dans mes affaires."],["Ô Allah, je Te demande le bien de cette affaire et le bien de ce qui la suit, et je cherche refuge auprès de Toi contre son mal et le mal de ce qui la suit.","Ô Allah, je me suis soumis à Toi et je Te confie mes affaires … il n’y a de refuge ni de salut contre Toi qu’auprès de Toi.","Notre Seigneur, accorde-nous une miséricorde de Ta part et dispose pour nous une bonne direction dans notre affaire.","Mon Seigneur, j’ai grand besoin du bien que Tu m’enverras.","Ô Allah, je Te demande la réussite et la droiture, et que Tu rendes mes jours à venir meilleurs que ceux qui sont passés."],["Ô Allah, je cherche refuge auprès de Toi contre le souci et le chagrin, l’impuissance et la paresse, la lâcheté et l’avarice, l’accablement de la dette et la domination des hommes.","Pas de divinité en dehors de Toi ! Gloire à Toi ! J’ai été du nombre des injustes.","Ô Vivant, ô Subsistant, c’est par Ta miséricorde que je cherche secours.","Notre Seigneur, déverse sur nous la patience et fais-nous mourir en musulmans.","Notre Seigneur, ne laisse pas dévier nos cœurs après que Tu nous as guidés, et accorde-nous une miséricorde de Ta part.","Notre Seigneur, accorde-nous un bien ici-bas et un bien dans l’au-delà, et protège-nous du châtiment du Feu.","Ô Allah, je suis Ton serviteur, fils de Ton serviteur, fils de Ta servante … que Tu fasses du Coran le printemps de mon cœur, la lumière de ma poitrine, la disparition de ma tristesse et la fin de mon souci."],["Notre Seigneur, nous nous sommes fait du tort ; si Tu ne nous pardonnes pas et ne nous fais pas miséricorde, nous serons certes parmi les perdants.","Mon Seigneur, pardonne-moi et accepte mon repentir ; Tu es Celui qui accepte le repentir, le Miséricordieux.","Ô Allah, aide-moi à T’évoquer, à Te remercier et à bien T’adorer.","Ô Allah, je Te demande la guidée, la piété, la chasteté et la suffisance.","Ô Allah, pardonne-moi ce que j’ai fait et ce que je ferai, ce que j’ai caché et ce que j’ai déclaré, et ce que Tu connais mieux que moi.","Ô Allah, ramène-moi à Toi d’un beau retour."],["Ô Allah, je Te demande la guidée, la piété, la chasteté et la suffisance.","Ô Allah, aide-moi à T’évoquer, à Te remercier et à bien T’adorer.","Ô Allah, je cherche refuge auprès de Toi contre l’impuissance et la paresse.","Ô Allah, accorde-moi une haute détermination, une âme sereine et des œuvres bonnes et agréées.","Notre Seigneur, déverse sur nous la patience et affermis nos pas.","Ô Allah, ne fais pas de moi de ceux qui connaissent le chemin puis se relâchent pour y marcher."],["Mon Seigneur, inspire-moi de Te remercier pour Ton bienfait dont Tu m’as comblé, ainsi que mes parents.","Ô Allah, aide-moi à T’évoquer, à Te remercier et à bien T’adorer.","Ô Allah, à Toi la louange jusqu’à ce que Tu sois satisfait, à Toi la louange quand Tu es satisfait, et à Toi la louange après la satisfaction.","Ô Allah, tout bienfait qui m’est arrivé ce matin, ou à l’une de Tes créatures, vient de Toi seul, sans associé ; à Toi la louange et à Toi la reconnaissance.","Ô Allah, fais de moi l’un de Tes serviteurs reconnaissants et ne fais pas de moi de ceux qui oublient Tes bienfaits.","Ô Allah, accorde-moi un cœur reconnaissant, une langue qui T’évoque et des œuvres bonnes et agréées."]],"msg":["Tu n’as pas à tout porter d’un seul coup. Prends les moyens et demande l’aide d’Allah.","L’avenir relève de l’invisible, et ton Seigneur qui connaît l’invisible est aussi ton Seigneur aujourd’hui.","Tu peux dire à Allah ce que tu ne peux dire à personne.","Ne laisse pas le regret d’hier t’empêcher de réparer aujourd’hui.","N’attends pas d’en avoir envie pour commencer ; commence par un tout petit pas.","Considère ce que tu as aujourd’hui : c’était autrefois une invocation que tu adressais à Allah."],"w":["Sourate Ash-Sharh + adhkar apaisants","Sourate At-Talaq + versets sur l’abandon confiant à Allah","Sourate Yousouf + l’invocation de Jonas","Sourate Az-Zumar (verset 53) + demande de pardon","Sourate Ad-Douha + sourate Ash-Sharh","Sourate Ar-Rahman + l’invocation de Salomon"]},id:{"sn":{"الرعد":"Ar-Ra‘d","البقرة":"Al-Baqarah","ق":"Qaf","الحديد":"Al-Hadid","الشرح":"Ash-Sharh","النحل":"An-Nahl","الفتح":"Al-Fath","آل عمران":"Ali ‘Imran","الكهف":"Al-Kahf","الطلاق":"At-Talaq","يوسف":"Yusuf","طه":"Ta-Ha","التوبة":"At-Tawbah","الأنعام":"Al-An‘am","هود":"Hud","الإسراء":"Al-Isra","الزمر":"Az-Zumar","النساء":"An-Nisa","الفرقان":"Al-Furqan","القصص":"Al-Qasas","إبراهيم":"Ibrahim","الضحى":"Ad-Duha","الطور":"At-Tur","الشورى":"Ash-Shura","الحجر":"Al-Hijr","النمل":"An-Naml","الأنبياء":"Al-Anbiya","مريم":"Maryam","النجم":"An-Najm","النور":"An-Nur","العنكبوت":"Al-‘Ankabut","الزلزلة":"Az-Zalzalah","الأعراف":"Al-A‘raf","الليل":"Al-Layl","نوح":"Nuh","الشعراء":"Ash-Shu‘ara","سبأ":"Saba’","لقمان":"Luqman","المؤمنون":"Al-Mu’minun"},"src":{"صحيح البخاري":"Sahih al-Bukhari","صحيح مسلم":"Sahih Muslim","سنن أبي داود":"Sunan Abi Dawud","سنن الترمذي":"Jami‘ at-Tirmidzi","سنن أبي داود والترمذي":"Abu Dawud & at-Tirmidzi","متفق عليه":"Muttafaq ‘alaih (Bukhari & Muslim)","مسند أحمد (صححه عدد من أهل العلم)":"Musnad Ahmad (dinilai sahih oleh sejumlah ulama)"},"vt":{"الرعد: 28":"Ingatlah, hanya dengan mengingat Allah hati menjadi tenteram.","البقرة: 286":"Allah tidak membebani seseorang melainkan sesuai dengan kesanggupannya.","ق: 16":"Kami telah menciptakan manusia dan Kami mengetahui apa yang dibisikkan oleh hatinya.","الحديد: 4":"Dan Dia bersama kamu di mana pun kamu berada.","الشرح: 5-6":"Sesungguhnya bersama kesulitan ada kemudahan. Sesungguhnya bersama kesulitan ada kemudahan.","النحل: 127":"Bersabarlah, dan kesabaranmu hanyalah dengan pertolongan Allah.","البقرة: 45":"Mohonlah pertolongan dengan sabar dan salat.","الفتح: 4":"Dialah yang menurunkan ketenangan ke dalam hati orang-orang mukmin.","آل عمران: 139*":"Janganlah kamu lemah dan janganlah bersedih hati.","الكهف: 24":"Dan ingatlah Tuhanmu apabila kamu lupa.","الشرح: 7-8":"Maka apabila engkau telah selesai (dari satu urusan), tetaplah bekerja keras (untuk urusan lain), dan hanya kepada Tuhanmu berharaplah.","الطلاق: 4":"Barang siapa bertakwa kepada Allah, Dia menjadikan urusannya mudah.","يوسف: 64":"Dan Dia Maha Penyayang di antara para penyayang.","البقرة: 153":"Sesungguhnya Allah bersama orang-orang yang sabar.","الشرح: 1":"Bukankah Kami telah melapangkan dadamu untukmu?","طه: 25-26":"Ya Tuhanku, lapangkanlah dadaku dan mudahkanlah urusanku.","الكهف: 10":"Ya Tuhan kami, berilah kami rahmat dari sisi-Mu dan sempurnakanlah petunjuk yang lurus bagi kami dalam urusan kami.","التوبة: 40":"Jangan bersedih, sesungguhnya Allah bersama kita.","البقرة: 216":"Boleh jadi kamu membenci sesuatu padahal itu baik bagimu.","الطلاق: 3":"Barang siapa bertawakal kepada Allah, niscaya Dia mencukupkan (keperluan)nya.","الأنعام: 59":"Dan di sisi-Nya kunci-kunci semua yang gaib; tidak ada yang mengetahuinya selain Dia.","هود: 6":"Tidak ada satu makhluk bergerak pun di bumi melainkan Allah-lah yang memberi rezekinya.","الطلاق: 1":"Engkau tidak tahu, boleh jadi setelah itu Allah mengadakan suatu perkara baru.","التوبة: 51":"Katakanlah: Tidak akan menimpa kami selain apa yang telah ditetapkan Allah bagi kami; Dialah pelindung kami.","هود: 88":"Dan taufik bagiku hanyalah dengan (pertolongan) Allah.","الإسراء: 31":"Kamilah yang memberi rezeki kepada mereka dan kepadamu.","يوسف: 100":"Sesungguhnya Tuhanku Maha Lembut terhadap apa yang Dia kehendaki.","طه: 73":"Dan Allah lebih baik dan lebih kekal.","الزمر: 36":"Bukankah Allah cukup untuk melindungi hamba-Nya?","هود: 123":"Dan milik Allah segala yang gaib di langit dan di bumi, dan kepada-Nya semua urusan dikembalikan.","آل عمران: 159":"Apabila engkau telah membulatkan tekad, maka bertawakallah kepada Allah.","يوسف: 87":"Dan jangan berputus asa dari rahmat Allah.","النساء: 81":"Dan cukuplah Allah sebagai pelindung.","الفرقان: 58":"Dan bertawakallah kepada Yang Maha Hidup yang tidak mati.","القصص: 13":"Maka Kami mengembalikannya kepada ibunya agar senang hatinya dan tidak bersedih.","إبراهيم: 37":"Ya Tuhan kami, aku telah menempatkan sebagian keturunanku di lembah yang tidak ada tanamannya.","يوسف: 86":"Hanya kepada Allah aku mengadukan kesusahan dan kesedihanku.","آل عمران: 139":"Janganlah kamu lemah dan janganlah bersedih hati, padahal kamulah yang paling tinggi jika kamu beriman.","الضحى: 3":"Tuhanmu tidak meninggalkanmu dan tidak (pula) membencimu.","الضحى: 5":"Dan kelak Tuhanmu pasti memberimu (karunia) hingga engkau puas.","البقرة: 155":"Dan sampaikanlah kabar gembira kepada orang-orang yang sabar.","الشرح: 6":"Sesungguhnya bersama kesulitan ada kemudahan.","الطور: 48":"Bersabarlah menunggu ketetapan Tuhanmu, karena sesungguhnya engkau berada dalam penglihatan Kami.","الشورى: 28":"Dan Dialah yang menurunkan hujan setelah mereka berputus asa.","البقرة: 186":"Aku dekat; Aku mengabulkan permohonan orang yang berdoa apabila dia berdoa kepada-Ku.","الحجر: 97":"Kami tahu bahwa dadamu menjadi sempit karena apa yang mereka ucapkan.","الحجر: 98":"Maka bertasbihlah dengan memuji Tuhanmu dan jadilah engkau termasuk orang yang bersujud.","النمل: 70":"Dan janganlah engkau bersedih hati terhadap mereka dan jangan (pula) bersempit dada karena tipu daya mereka.","الأنبياء: 83":"Sesungguhnya aku telah ditimpa penyakit, dan Engkau Maha Penyayang di antara para penyayang.","الأنبياء: 87":"Tidak ada tuhan selain Engkau, Mahasuci Engkau. Sesungguhnya aku termasuk orang yang zalim.","مريم: 24":"Janganlah engkau bersedih hati, sungguh Tuhanmu telah menjadikan anak sungai di bawahmu.","الزمر: 53":"Katakanlah: Wahai hamba-hamba-Ku yang melampaui batas terhadap diri mereka sendiri, jangan berputus asa dari rahmat Allah.","البقرة: 222":"Sesungguhnya Allah menyukai orang yang bertobat dan menyukai orang yang menyucikan diri.","الشورى: 25":"Dan Dialah yang menerima tobat dari hamba-hamba-Nya.","هود: 61":"Sesungguhnya Tuhanku sangat dekat lagi memperkenankan (doa).","النساء: 110":"Barang siapa berbuat kejahatan atau menzalimi dirinya, kemudian memohon ampun kepada Allah, niscaya dia mendapati Allah Maha Pengampun, Maha Penyayang.","هود: 114":"Sesungguhnya perbuatan-perbuatan baik menghapus perbuatan-perbuatan buruk.","آل عمران: 135":"Dan (juga) orang-orang yang apabila melakukan perbuatan keji atau menzalimi diri sendiri, mereka mengingat Allah lalu memohon ampun atas dosa-dosa mereka.","الفرقان: 70":"Maka kejahatan mereka diganti Allah dengan kebajikan.","النور: 31":"Dan bertobatlah kamu semua kepada Allah, wahai orang-orang yang beriman, agar kamu beruntung.","النجم: 39":"Dan bahwa manusia hanya memperoleh apa yang telah diusahakannya.","التوبة: 105":"Dan katakanlah: Bekerjalah kamu, maka Allah akan melihat pekerjaanmu.","العنكبوت: 69":"Dan orang-orang yang berjihad (bersungguh-sungguh) untuk (mencari keridaan) Kami, Kami akan tunjukkan kepada mereka jalan-jalan Kami.","البقرة: 148":"Maka berlomba-lombalah dalam kebaikan.","الزلزلة: 7":"Barang siapa mengerjakan kebaikan seberat zarah pun, dia akan melihat (balasan)nya.","الأعراف: 23":"Ya Tuhan kami, kami telah menzalimi diri kami sendiri; jika Engkau tidak mengampuni kami dan tidak merahmati kami, niscaya kami termasuk orang-orang yang rugi.","التوبة: 120":"Sesungguhnya Allah tidak menyia-nyiakan pahala orang-orang yang berbuat baik.","الليل: 4":"Sesungguhnya usahamu memang beraneka macam.","الأنبياء: 94":"Barang siapa mengerjakan kebajikan sedang dia beriman, maka usahanya tidak akan diingkari.","هود: 112":"Maka tetaplah engkau (di jalan yang benar), sebagaimana diperintahkan kepadamu.","طه: 14":"Dan laksanakanlah salat untuk mengingat Aku.","طه: 114":"Dan katakanlah: Ya Tuhanku, tambahkanlah ilmu kepadaku.","نوح: 5":"Dia berkata: Ya Tuhanku, sesungguhnya aku telah menyeru kaumku siang dan malam.","الشعراء: 62":"Dia (Musa) berkata: Sekali-kali tidak! Sesungguhnya Tuhanku bersamaku, Dia akan memberi petunjuk kepadaku.","إبراهيم: 7":"Jika kamu bersyukur, niscaya Aku akan menambah (nikmat) kepadamu.","البقرة: 152":"Maka ingatlah kepada-Ku, Aku pun akan ingat kepadamu. Bersyukurlah kepada-Ku dan jangan ingkar kepada-Ku.","سبأ: 13":"Bekerjalah wahai keluarga Dawud untuk bersyukur; dan sedikit sekali hamba-Ku yang bersyukur.","إبراهيم: 34":"Jika kamu menghitung nikmat Allah, niscaya kamu tidak akan dapat menghitungnya.","النحل: 53":"Dan nikmat apa pun yang ada pada kamu, (datangnya) dari Allah.","الضحى: 11":"Dan terhadap nikmat Tuhanmu, hendaklah kamu menyebut-nyebutnya (dengan bersyukur).","آل عمران: 144":"Dan Allah akan memberi balasan kepada orang-orang yang bersyukur.","البقرة: 243":"Sesungguhnya Allah memiliki karunia atas manusia, tetapi kebanyakan manusia tidak bersyukur.","سبأ: 15":"Makanlah dari rezeki yang (dianugerahkan) Tuhanmu dan bersyukurlah kepada-Nya.","النحل: 114":"Dan bersyukurlah atas nikmat Allah, jika hanya kepada-Nya kamu menyembah.","إبراهيم: 5":"Sungguh, pada yang demikian itu terdapat tanda-tanda bagi setiap orang yang sangat sabar dan banyak bersyukur.","لقمان: 12":"Dan sungguh, telah Kami berikan hikmah kepada Luqman: Bersyukurlah kepada Allah. Barang siapa bersyukur, maka sesungguhnya dia bersyukur untuk dirinya sendiri.","المؤمنون: 78":"Dan Dialah yang menciptakan pendengaran, penglihatan, dan hati bagimu; sedikit sekali kamu bersyukur.","النمل: 19":"Ya Tuhanku, ilhamkanlah aku untuk mensyukuri nikmat-Mu yang telah Engkau anugerahkan kepadaku dan kepada kedua orang tuaku, dan agar aku mengerjakan kebajikan yang Engkau ridai.","النمل: 15":"Segala puji bagi Allah yang melebihkan kami atas banyak hamba-Nya yang beriman."},"s":[[["Musa (alaihissalam) menghadapi tugas berat","Ketika Musa diutus menghadapi Fir‘aun, ia memohon kepada Allah agar melapangkan dadanya dan memudahkan urusannya.","Meski tugas lebih besar dari yang kamu bayangkan, mulailah dengan memohon pertolongan Allah."],["Para Pemuda Penghuni Gua (Ashabul Kahfi)","Para pemuda menghadapi kenyataan yang berat dan tekanan besar, lalu mereka kembali kepada Allah dan memohon rahmat serta petunjuk yang lurus.","Ketika kamu tidak tahu jalan, mintalah kepada Allah agar menunjukkannya."],["Nabi ﷺ di dalam gua","Nabi ﷺ dan Abu Bakar (semoga Allah meridainya) berada di dalam gua dengan bahaya yang dekat, lalu Nabi ﷺ menenangkannya.","Keadaan boleh menyempit, tetapi kebersamaan Allah lebih besar daripada semua yang kamu takutkan."],["Sebab turunnya ayat: “Allah tidak membebani seseorang melainkan sesuai kesanggupannya”","Ketika turun ayat “Jika kamu menampakkan apa yang ada di dalam dirimu atau menyembunyikannya, Allah akan memperhitungkannya”, hal itu terasa berat bagi para sahabat, lalu mereka datang kepada Nabi ﷺ dan berkata bahwa mereka tidak sanggup. Maka Allah menurunkan “Allah tidak membebani seseorang melainkan sesuai kesanggupannya” sebagai keringanan. (HR. Muslim)","Allah tidak pernah membebanimu melebihi kemampuanmu."]],[["Yusuf (alaihissalam): masa depan yang tak terduga","Yusuf dilemparkan ke sumur, lalu dijual, lalu dipenjara. Namun kisahnya tidak berhenti di sana: ia menjadi pembesar Mesir dan berkumpul kembali dengan keluarganya setelah bertahun-tahun berpisah. (Surah Yusuf)","Jangan menilai masa depanmu dari keadaanmu sekarang; peristiwa yang hikmahnya belum kamu lihat hari ini mungkin bagian dari jalan yang tak pernah kamu bayangkan."],["Ibu Nabi Musa","Ia meletakkan bayinya dalam peti dan menghanyutkannya ke sungai atas perintah Allah, padahal keadaannya tampak menakutkan, lalu Allah mengembalikannya kepadanya.","Rencana Allah untukmu mungkin lebih besar daripada kemampuanmu membayangkan jalan keluar."],["Ibrahim (alaihissalam)","Ibrahim meninggalkan keluarganya di lembah yang tandus dan berpaling kepada Allah dengan doa.","Ketika kamu tidak bisa mengendalikan keadaan, kamu tetap bisa berdoa."],["Nabi ﷺ dan Abu Bakar di dalam gua","Orang-orang musyrik berdiri di mulut gua, lalu Abu Bakar berkata: “Seandainya salah seorang dari mereka melihat ke bawah kakinya, tentu ia melihat kita!” Nabi ﷺ menjawab: “Bagaimana pendapatmu tentang dua orang yang Allah adalah yang ketiganya?” (HR. Bukhari)","Keyakinan kepada Allah mengubah rasa takut menjadi ketenangan."]],[["Yakub (alaihissalam): kesedihan yang tak memutus harapan","Yakub kehilangan putranya Yusuf dan kesedihannya begitu berat hingga matanya memutih, namun ia tidak pernah kehilangan kepercayaannya kepada Allah.","Kamu tidak harus selalu berpura-pura kuat; kamu boleh mengadukan kesedihanmu kepada Allah."],["Ayyub (alaihissalam): ketika ujian berlangsung lama","Ayyub diuji, namun tetap bergantung kepada Tuhannya, maka Allah mengabulkan doanya dan menghilangkan penyakitnya.","Ujian yang panjang bukan berarti rahmat Allah tidak ada."],["Yunus (alaihissalam): dalam tiga kegelapan","Yunus berada dalam gelapnya laut, malam, dan perut ikan paus, namun ia tidak pernah kehilangan pintu doa.","Bahkan di titik terdalam kesedihan, pintu Allah tetap terbuka."],["Maryam (alaihassalam)","Ketika rasa sakit melahirkan menimpanya dan ia berada dalam keadaan yang sangat sulit, datanglah penguatan dan penenang dari Allah.","Rahmat bisa datang tepat saat kamu merasa sendirian."],["Sebab turunnya Surah Ad-Duha","Nabi ﷺ sakit dan tidak salat malam selama satu atau dua malam. Seorang perempuan datang dan berkata: “Wahai Muhammad, kurasa setanmu telah meninggalkanmu!” Maka Allah menurunkan: “Demi waktu duha, dan demi malam apabila telah sunyi, Tuhanmu tidak meninggalkanmu dan tidak (pula) membencimu.” (Muttafaq ‘alaih)","Tuhanmu tidak meninggalkanmu dan tidak akan meninggalkanmu."]],[["Adam (alaihissalam): kesalahan bukan akhir perjalanan","Ketika Adam tergelincir, ia tidak terus menjauh; ia bertobat kepada Allah.","Mengakui kesalahan dan kembali kepada Allah adalah awal yang baru."],["Ka‘b bin Malik (semoga Allah meridainya)","Ka‘b tertinggal dari pasukan Tabuk tanpa uzur, lalu berkata jujur kepada Nabi ﷺ tanpa mencari-cari alasan. Ia melewati ujian berat hingga Allah menerima tobatnya. (Surah At-Taubah 117–119; HR. Bukhari dan Muslim)","Jangan menyikapi kekuranganmu dengan menyangkalnya; hadapi dengan kejujuran, amal, dan tobat."],["Lelaki yang membunuh seratus orang","Seorang lelaki membunuh sembilan puluh sembilan orang, bertanya tentang tobat, lalu menggenapkannya menjadi seratus. Namun ia tidak berputus asa dari rahmat Allah; ia berangkat menuju tobat dan para malaikat mencabut nyawanya di tengah perjalanan. (HR. Bukhari dan Muslim)","Sejauh apa pun seseorang pergi, jangan menutup pintu kembali bagi dirinya."],["Sebab turunnya ayat: “Katakanlah: Wahai hamba-hamba-Ku yang melampaui batas”","Sekelompok orang yang banyak berbuat dosa sebelum Islam bertanya kepada Nabi ﷺ apakah masih ada tobat bagi mereka; maka turunlah ayat ini membuka pintu harapan. (HR. Bukhari)","Rahmat Allah lebih luas daripada setiap dosa."]],[["Nuh (alaihissalam): terus berjalan di jalan yang panjang","Ia menyeru kaumnya siang dan malam dan terus menyeru dalam waktu yang sangat lama.","Tidak setiap usaha menampakkan hasil dengan cepat, dan tidak setiap keberhasilan datang pada percobaan pertama."],["Musa (alaihissalam): dari rasa takut menuju keberanian","Musa takut menghadapi Fir‘aun, namun ia melangkah dengan bersandar kepada Allah.","Keberanian bukan tiadanya rasa takut, melainkan terus melangkah sambil memohon pertolongan Allah."],["Zulkarnain: bekerja dan mengambil sebab","Ketika menghadapi masalah Ya’juj dan Ma’juj, ia tidak berhenti pada doa; ia bekerja, mengambil sebab, dan memanfaatkan sumber daya yang ada. (Al-Kahfi 83–98)","Bertawakal kepada Allah bukan berarti menunggu perubahan tanpa berusaha."]],[["Sulaiman (alaihissalam) dan semut","Ketika Sulaiman mendengar semut memperingatkan kaumnya, ia menyadari nikmat Allah atas dirinya lalu berdoa kepada Tuhannya.","Semakin banyak nikmatmu, semakin besar kebutuhanmu akan rasa syukur."],["Dawud dan Sulaiman (alaihimassalam)","Allah menganugerahi mereka ilmu, kerajaan, dan kekuasaan, namun mereka tahu bahwa segala karunia itu dari Allah.","Keberhasilan sejati adalah mengembalikan pujian kepada Pemiliknya."],["Nabi ﷺ dan salat malam","Nabi ﷺ salat malam hingga kedua kakinya bengkak. Beliau ditanya: “Apakah engkau melakukan ini padahal Allah telah mengampuni dosamu yang lalu dan yang akan datang?” Beliau menjawab: “Tidakkah aku ingin menjadi hamba yang bersyukur?” (Muttafaq ‘alaih)","Syukur bukan sekadar kata-kata; ia tampak dalam amal dan ibadah."]]],"d":[["Ya Allah, aku berlindung kepada-Mu dari kesusahan dan kesedihan, dari kelemahan dan kemalasan, dari sifat pengecut dan kikir, dari lilitan utang dan penindasan orang.","Ya Tuhanku, lapangkanlah dadaku dan mudahkanlah urusanku.","Ya Allah, tolonglah aku dan jangan Engkau tolong (pihak lain) melawanku; bantulah aku dan jangan bantu (pihak lain) melawanku; tunjukilah aku dan mudahkanlah petunjuk bagiku.","Wahai Yang Maha Hidup, wahai Yang Maha Berdiri Sendiri, dengan rahmat-Mu aku memohon pertolongan; perbaikilah seluruh urusanku dan jangan serahkan aku kepada diriku sendiri walau sekejap mata.","Ya Allah, aku memohon kepada-Mu ketenangan di hati, ketentraman di jiwa, keberkahan dalam waktu, dan kemudahan dalam urusan."],["Ya Allah, aku memohon kepada-Mu kebaikan urusan ini dan kebaikan setelahnya, dan aku berlindung kepada-Mu dari keburukannya dan keburukan setelahnya.","Ya Allah, aku berserah diri kepada-Mu dan menyerahkan urusanku kepada-Mu … tiada tempat berlindung dan tempat selamat dari-Mu kecuali kepada-Mu.","Ya Tuhan kami, berilah kami rahmat dari sisi-Mu dan sempurnakanlah petunjuk yang lurus bagi kami dalam urusan kami.","Ya Tuhanku, sesungguhnya aku sangat membutuhkan kebaikan apa pun yang Engkau turunkan kepadaku.","Ya Allah, aku memohon kepada-Mu taufik dan ketepatan, serta jadikanlah hari-hariku yang akan datang lebih baik daripada yang telah berlalu."],["Ya Allah, aku berlindung kepada-Mu dari kesusahan dan kesedihan, dari kelemahan dan kemalasan, dari sifat pengecut dan kikir, dari lilitan utang dan penindasan orang.","Tidak ada tuhan selain Engkau, Mahasuci Engkau. Sesungguhnya aku termasuk orang yang zalim.","Wahai Yang Maha Hidup, wahai Yang Maha Berdiri Sendiri, dengan rahmat-Mu aku memohon pertolongan.","Ya Tuhan kami, limpahkanlah kesabaran kepada kami dan wafatkanlah kami dalam keadaan muslim.","Ya Tuhan kami, janganlah Engkau condongkan hati kami setelah Engkau beri petunjuk kepada kami, dan anugerahkanlah kepada kami rahmat dari sisi-Mu.","Ya Tuhan kami, berilah kami kebaikan di dunia dan kebaikan di akhirat, dan lindungilah kami dari azab neraka.","Ya Allah, aku hamba-Mu, anak hamba-Mu, anak hamba perempuan-Mu … jadikanlah Al-Qur’an penyejuk hatiku, cahaya dadaku, penghilang dukaku, dan pelenyap kegelisahanku."],["Ya Tuhan kami, kami telah menzalimi diri kami sendiri; jika Engkau tidak mengampuni kami dan tidak merahmati kami, niscaya kami termasuk orang-orang yang rugi.","Ya Tuhanku, ampunilah aku dan terimalah tobatku; Engkaulah Maha Penerima tobat lagi Maha Penyayang.","Ya Allah, bantulah aku untuk berzikir kepada-Mu, bersyukur kepada-Mu, dan beribadah dengan baik kepada-Mu.","Ya Allah, aku memohon kepada-Mu petunjuk, ketakwaan, kesucian diri, dan kecukupan.","Ya Allah, ampunilah aku atas apa yang telah kulakukan dan yang akan kulakukan, yang kusembunyikan dan yang kutampakkan, dan atas apa yang Engkau lebih mengetahuinya daripada aku.","Ya Allah, kembalikanlah aku kepada-Mu dengan cara yang indah."],["Ya Allah, aku memohon kepada-Mu petunjuk, ketakwaan, kesucian diri, dan kecukupan.","Ya Allah, bantulah aku untuk berzikir kepada-Mu, bersyukur kepada-Mu, dan beribadah dengan baik kepada-Mu.","Ya Allah, aku berlindung kepada-Mu dari kelemahan dan kemalasan.","Ya Allah, anugerahkanlah kepadaku tekad yang tinggi, jiwa yang tenang, dan amal saleh yang diterima.","Ya Tuhan kami, limpahkanlah kesabaran kepada kami dan teguhkanlah pendirian kami.","Ya Allah, janganlah jadikan aku termasuk orang yang mengetahui jalan lalu malas menempuhnya."],["Ya Tuhanku, ilhamkanlah aku untuk mensyukuri nikmat-Mu yang telah Engkau berikan kepadaku dan kepada kedua orang tuaku.","Ya Allah, bantulah aku untuk berzikir kepada-Mu, bersyukur kepada-Mu, dan beribadah dengan baik kepada-Mu.","Ya Allah, bagi-Mu segala puji hingga Engkau rida, bagi-Mu segala puji ketika Engkau rida, dan bagi-Mu segala puji setelah rida.","Ya Allah, nikmat apa pun yang ada padaku pagi ini atau pada salah satu makhluk-Mu, itu dari-Mu semata, tiada sekutu bagi-Mu; bagi-Mu pujian dan bagi-Mu rasa syukur.","Ya Allah, jadikanlah aku termasuk hamba-hamba-Mu yang bersyukur dan jangan jadikan aku termasuk orang yang melupakan nikmat-Mu.","Ya Allah, anugerahkanlah kepadaku hati yang bersyukur, lisan yang berzikir, dan amal saleh yang diterima."]],"msg":["Kamu tidak harus memikul semuanya sekaligus. Ambillah sebab dan mohonlah pertolongan Allah.","Masa depan itu gaib, dan Tuhanmu yang mengetahui yang gaib adalah Tuhanmu hari ini juga.","Kamu boleh mengadu kepada Allah tentang apa yang tak bisa kamu katakan kepada siapa pun.","Jangan biarkan penyesalan atas kemarin menghalangimu memperbaiki hari ini.","Jangan menunggu ingin dulu baru mulai; mulailah dengan satu langkah kecil.","Renungkan apa yang kamu miliki hari ini; dulu itu adalah doa yang pernah kamu panjatkan kepada Allah."],"w":["Surah Asy-Syarh + zikir penenang","Surah At-Talaq + ayat-ayat tawakal","Surah Yusuf + doa Nabi Yunus","Surah Az-Zumar (ayat 53) + istigfar","Surah Ad-Duha + Surah Asy-Syarh","Surah Ar-Rahman + doa Nabi Sulaiman"]}};})();

"البقرة: 286":{ar:"الآية تقرر أن التكليف الإلهي في حدود المقدور؛ فما عجزت عنه حقاً لا يحاسبك الله عليه.",en:"The verse establishes that divine obligation stays within what is possible; what you truly cannot do, Allah does not hold you to.",fr:"Le verset établit que l’obligation divine reste dans les limites du possible ; ce que tu ne peux vraiment pas faire, Allah ne t’en tient pas rigueur.",id:"Ayat ini menegaskan bahwa kewajiban dari Allah berada dalam batas kemampuan; apa yang benar-benar tak sanggup kamu lakukan tidak dipertanggungjawabkan."},
"الشرح: 5-6":{ar:"ذكر بعض العلماء أن «العسر» جاء معرّفاً فهو واحد، و«يسراً» جاءت منكّرة فهي متعددة؛ فالعسر الواحد يصحبه أكثر من يسر.",en:"Some scholars noted that “hardship” appears with the definite article (one hardship) while “ease” appears indefinite (more than one), so a single hardship is accompanied by more than one ease.",fr:"Certains savants ont relevé que « la difficulté » est déterminée (une seule) alors que « la facilité » est indéterminée (plusieurs) : une seule difficulté s’accompagne donc de plus d’une facilité.",id:"Sebagian ulama mencatat bahwa “kesulitan” disebut dengan kata sandang tentu (satu), sedangkan “kemudahan” tanpa kata sandang (lebih dari satu), sehingga satu kesulitan disertai lebih dari satu kemudahan."},
"الرعد: 28":{ar:"الطمأنينة هنا مرتبطة بذكر الله؛ فالقلب يسكن باتصاله بربه حتى قبل أن تتغير الظروف.",en:"Here, calm is tied to remembering Allah: the heart settles through its connection to its Lord, even before circumstances change.",fr:"Ici, la sérénité est liée à l’évocation d’Allah : le cœur s’apaise par son lien avec son Seigneur, avant même que les circonstances ne changent.",id:"Di sini ketenangan terkait dengan mengingat Allah: hati menjadi tenang karena terhubung dengan Tuhannya, bahkan sebelum keadaan berubah."},
"التوبة: 40":{ar:"المعية هنا معية حفظ وتأييد، وقد طمأن بها النبي ﷺ صاحبه في أشد لحظات الخطر.",en:"This is the companionship of protection and support, and with it the Prophet ﷺ reassured his companion at the most dangerous moment.",fr:"C’est la compagnie de protection et de soutien, par laquelle le Prophète ﷺ rassura son compagnon au moment le plus dangereux.",id:"Ini adalah kebersamaan berupa penjagaan dan pertolongan, yang dengannya Nabi ﷺ menenangkan sahabatnya pada saat paling berbahaya."},
"الطلاق: 3":{ar:"التوكل أن يعتمد القلب على الله وهو يأخذ بالأسباب؛ و«فهو حسبه» وعد بالكفاية.",en:"Trust means the heart relies on Allah while you still take the means; “then He is sufficient for him” is a promise of full sufficiency.",fr:"La confiance en Allah, c’est un cœur qui s’appuie sur Lui tout en prenant les moyens ; « Il lui suffit » est une promesse de suffisance totale.",id:"Tawakal berarti hati bersandar kepada Allah sambil tetap menempuh sebab; “maka Dia mencukupkannya” adalah janji kecukupan."},
"البقرة: 216":{ar:"علمنا ناقص وعلم الله محيط؛ فقد يكون ما تكرهه اليوم باباً لخير لا تراه الآن.",en:"Our knowledge is limited and Allah’s is complete; what you dislike today may be a door to a good you cannot yet see.",fr:"Notre savoir est limité et celui d’Allah est complet ; ce que tu n’aimes pas aujourd’hui peut être la porte d’un bien que tu ne vois pas encore.",id:"Pengetahuan kita terbatas, sedangkan ilmu Allah meliputi segalanya; apa yang kamu benci hari ini mungkin pintu menuju kebaikan yang belum kamu lihat."},
"الضحى: 3":{ar:"الآية تنفي عن القلب الحزين شعور الهجر؛ الحزن لا يعني أن الله تركك.",en:"The verse removes the feeling of being abandoned from a sorrowful heart: sadness does not mean Allah has left you.",fr:"Le verset ôte au cœur triste le sentiment d’abandon : la tristesse ne signifie pas qu’Allah t’a quitté.",id:"Ayat ini menghapus rasa ditinggalkan dari hati yang sedih: kesedihan bukan berarti Allah meninggalkanmu."},
"يوسف: 86":{ar:"الشكوى إلى الله لا تنافي الصبر؛ فقد قال يعقوب قبلها «فصبر جميل» ثم شكا إلى الله وحده.",en:"Complaining to Allah does not contradict patience: Yaqub first said “beautiful patience” and then complained to Allah alone.",fr:"Se plaindre à Allah ne contredit pas la patience : Jacob dit d’abord « patience belle », puis se plaignit à Allah seul.",id:"Mengadu kepada Allah tidak bertentangan dengan sabar: Yakub lebih dulu berkata “sabar yang baik”, lalu mengadu hanya kepada Allah."},
"الزمر: 53":{ar:"جاء النداء بـ«يا عبادي» مع الإسراف؛ نداء قرب لا طرد. وعدّها بعض العلماء من أرجى آيات القرآن.",en:"The call comes as “My servants” even to those who transgressed: a call of closeness, not of rejection. Some scholars counted it among the most hope-giving verses of the Qur’an.",fr:"L’appel vient sous la forme « Mes serviteurs », même pour ceux qui ont commis des excès : un appel de proximité, pas de rejet. Certains savants l’ont comptée parmi les versets les plus porteurs d’espoir.",id:"Seruan datang dengan sebutan “hamba-hamba-Ku” bahkan kepada yang melampaui batas: seruan kedekatan, bukan penolakan. Sebagian ulama menganggapnya salah satu ayat paling menumbuhkan harapan."},
"آل عمران: 135":{ar:"التوبة تبدأ بالتذكّر؛ فذكر الله يوقظ القلب فيعود صاحبه.",en:"Repentance begins with remembrance: remembering Allah wakes the heart and brings a person back.",fr:"Le repentir commence par le souvenir : évoquer Allah réveille le cœur et ramène la personne.",id:"Tobat dimulai dari mengingat: mengingat Allah membangunkan hati dan membuat seseorang kembali."},
"النجم: 39":{ar:"السعي هو الطريق والنتيجة بيد الله؛ فلا تقس قيمتك بما لم يتحقق بعد.",en:"Effort is the path and the outcome is in Allah’s hands, so don’t measure your worth by what hasn’t happened yet.",fr:"L’effort est le chemin et le résultat est entre les mains d’Allah ; ne mesure donc pas ta valeur à ce qui ne s’est pas encore réalisé.",id:"Usaha adalah jalannya dan hasil ada di tangan Allah, maka jangan ukur nilai dirimu dari apa yang belum terwujud."},
"العنكبوت: 69":{ar:"الجزاء من جنس العمل: جاهدوا فينا فهدايتنا لهم؛ الخطوة منك والتيسير من الله.",en:"The reward matches the deed: those who strive for Us, We guide them; the step is yours and the ease is from Allah.",fr:"La récompense est à l’image de l’acte : ceux qui luttent pour Nous, Nous les guidons ; le pas vient de toi et la facilité vient d’Allah.",id:"Balasan sesuai amal: siapa yang bersungguh-sungguh untuk Kami, Kami tunjukkan jalan; langkahnya darimu, kemudahannya dari Allah."},
"إبراهيم: 7":{ar:"الشكر يستدعي المزيد: بالقلب إقراراً، وباللسان حمداً، وبالجوارح طاعة.",en:"Gratitude invites more: acknowledgment by the heart, praise by the tongue, obedience by the limbs.",fr:"La gratitude appelle davantage : reconnaissance du cœur, louange de la langue, obéissance des membres.",id:"Syukur mengundang tambahan nikmat: pengakuan dengan hati, pujian dengan lisan, ketaatan dengan anggota badan."},

const tadHTML=r=>{const x=TAD[r];if(!x)return '';const m=x[S.lang]||(isAr()?x.ar:'');return m?`<p class="tad">🌿 ${TADL[S.lang]}: ${m}</p>`:''};

/* ===== Content builders ===== */
function verseHTML(s){
  const [txt,ref]=s.split('|'),t=L[S.lang],i=TRI[ref],T=TR[S.lang];
  const tr=T?(T.vt[ref+(ref==='آل عمران: 139'&&!txt.includes('الْأَعْلَوْنَ')?'*':'')]||''):(!isAr()&&i!==undefined)?t.m[i][1]:'';
  return `<div class="ayah">${txt}</div><div class="ref">${dispRef(ref)}</div>${tr?`<p class="tr">${tr}</p>`:''}${tadHTML(ref)}`;
}
function storiesOf(e){
  const t=L[S.lang],T=TR[S.lang],old=["",t.m[e][2],"","",OLDK[e]];
  if(T)return LIB[e].s.map((s,i)=>[T.s[e][i][0],T.s[e][i][1],s[2],T.s[e][i][2],s[4]]).concat([old]);
  return isAr()?LIB[e].s.concat([old]):[old];
}
function msgsOf(e){const t=L[S.lang],T=TR[S.lang];return T?[t.m[e][0],T.msg[e]]:isAr()?[t.m[e][0],LIB[e].msg]:[t.m[e][0]]}
function doseHTML(e,k,n){
  const u=L[S.lang].ui,lib=LIB[e],ms=msgsOf(e),ss=storiesOf(e);
  const m=ms[k%ms.length],s=ss[k%ss.length],d=lib.d[k%lib.d.length],T=TR[S.lang],dt=T?T.d[e][k%lib.d.length]:'';
  const kind=s[4]==='s'?u.sabab:s[4]==='q'?u.lq:u.seerah;
  return `<article class="card dose"><h3>${u.dose} ${n}</h3><p class="msg">${m}</p>`+
   verseHTML(lib.v[(2*k)%lib.v.length])+verseHTML(lib.v[(2*k+1)%lib.v.length])+
   `<span class="tag">${kind}</span><div class="story">${s[0]?`<b>${s[0]}</b>`:''}${s[1]}</div>`+
   (s[2]?verseHTML(s[2]):'')+(s[3]?`<div class="lesson">💡 ${u.lesson}: ${s[3]}</div>`:'')+
   `<div class="dua">🤲 ${d[0]}${dt?`<div class="duatr">${dt}</div>`:''}<div class="dtype">${u['d'+d[1]]}${d[2]?' — '+srcOf(d[2]):''}</div></div></article>`;
}

function render(){

  document.documentElement.dir=t.d;document.documentElement.lang=S.lang;
  const mini=`<div class="mini"><img alt="" src="${LOGO}"></div>`;
  const arrow=t.d==='rtl'?'→':'←';
  const bar=$('bar');
  const initial=S.user&&S.user.name?S.user.name.trim().charAt(0).toUpperCase():'👤';
  const sub=inRoom?`<div class="bar"><button class="back" data-a="back" aria-label="${u.back}">${arrow}</button><h2>${E[S.room][0]} ${t.emo[S.room]}</h2></div>`:S.tab==='home'?'':`<div class="bar">${mini}<h2>${S.tab==='tasks'?u.tT:S.tab==='qibla'?u.tQ:u.tS}</h2></div>`;
  bar.innerHTML=`<div class="top"><select id="langTop" aria-label="${u.langL}">${Object.keys(L).map(k=>`<option value="${k}" ${k===S.lang?'selected':''}>${L[k].n}</option>`).join('')}</select><button class="avatar" data-a="edit" aria-label="${u.prof}">${initial}</button></div>`+sub;
  bar.style.flexDirection='column';bar.style.alignItems='stretch';
  const views={home:'vHome',tasks:'vTasks',qibla:'vQibla',set:'vSet'};
  ['vHome','vRoom','vTasks','vQibla','vSet'].forEach(v=>$(v).classList.remove('on'));
  $(inRoom?'vRoom':views[S.tab]).classList.add('on');
  $('tabs').innerHTML=[['home','🌿',u.tH],['tasks','✨',u.tT],['qibla','🧭',u.tQ],['set','⚙️',u.tS]].map(x=>`<button class="tab ${S.tab===x[0]&&!inRoom?'on':''}" data-a="tab" data-v="${x[0]}"><span>${x[1]}</span>${x[2]}</button>`).join('');
  const hello=S.user&&S.user.name?u.hi.replace('{n}',S.user.name):'';
  const cnt=E.map((_,i)=>todayDoses().filter(d=>d[0]===i).length);
  $('vHome').innerHTML=`<section class="hero"><div class="logo"><div class="badge"><img alt="سند" src="${LOGO}"></div></div><h1>${u.title}</h1><p>${u.tag}</p><div class="hello">${hello}</div></section>`+
   `<section class="card"><div class="t">${u.adT}</div><div class="s">${u.adS}</div>${verseHTML(allV[dayNo()%allV.length])}</section>`+
   `<section class="card"><div class="t">${u.hT}</div><div class="s">${u.hS}</div><div class="orbs">${E.map((x,i)=>`<button class="orb ${cnt[i]>=MAXD?'shut':''}" style="--c:${x[1]}" data-a="room" data-v="${i}">${x[0]} ${t.emo[i]}<small>${cnt[i]>=MAXD?'🔒':cnt[i]+'/'+MAXD}</small></button>`).join('')}</div></section>`;
  if(inRoom){
    const td=todayDoses().filter(x=>x[0]===S.room),mine=td.map((x,i)=>[x[0],x[1],i+1]).reverse();
    const full=td.length>=MAXD;
    $('vRoom').innerHTML=(isAr()||TR[S.lang]?`<div class="wird">📿 ${u.wird}: ${TR[S.lang]?TR[S.lang].w[S.room]:LIB[S.room].w}</div>`:'')+
     `<section class="card"><div class="pips">${[0,1,2].map(i=>`<span class="pip ${i<td.length?'f':''}"></span>`).join('')} ${u.today}: ${td.length}/${MAXD}</div>`+
     `<button class="go" data-a="take" ${full?'disabled':''}>${u.take}</button>${full?`<p class="limit">${u.limit}</p>`:''}${!mine.length&&!full?`<p class="s" style="margin-top:10px">${u.empty}</p>`:''}</section>`+
     mine.map(x=>doseHTML(x[0],x[1],x[2])).join('');
  }
  const wk=new Intl.DateTimeFormat(t.loc,{weekday:'narrow'});let wh='';
  for(let i=6;i>=0;i--){const d=back(i),ok=S.days.includes(key(d));wh+=`<div class="day"><div class="dot ${ok?'ok':''} ${i===0?'now':''}">${ok?'✓':''}</div>${wk.format(d)}</div>`}
  $('vTasks').innerHTML=`<section class="card"><div class="ihead"><div class="t">${u.iT}</div><div class="streak">🔥 ${streak()} ${u.days}</div></div><div class="s">${u.iS}</div><div class="week">${wh}</div>`+
   `<div class="ch">${t.ch[(dayNo()+S.swaps)%t.ch.length]}</div><button class="go ${done()?'done':''}" data-a="go" ${done()?'disabled':''}>${done()?u.ok:u.go}</button><button class="sw" data-a="sw">${u.sw}</button></section>`;
  $('vQibla').innerHTML=qiblaHTML();
  syncCompass();
  $('vSet').innerHTML=`<section class="card"><div class="t">${u.langL}</div><select id="lang" aria-label="${u.langL}">${Object.keys(L).map(k=>`<option value="${k}" ${k===S.lang?'selected':''}>${L[k].n}</option>`).join('')}</select></section>`+
   `<section class="card"><div class="t">${u.prof}</div><div class="who">${S.user&&S.user.name?S.user.name:'—'}</div><div class="mail">${S.user&&S.user.email?S.user.email:''}</div><div class="note">${u.dN}</div><button class="ghost" data-a="edit">${u.edit}</button><button class="sw" data-a="wipe">${u.wipe}</button></section>`+remCard();
  window.scrollTo(0,0);
}

/* ===== Actions ===== */
function save(){st.set('sanad_log',JSON.stringify(S.log));st.set('sanad_cur',JSON.stringify(S.cur))}
const act={
  tab(v){S.tab=v;S.room=null;render();if(v==='qibla'&&(!loc||Date.now()-loc.ts>18e5))getLoc(false)},
  room(v){S.room=+v;render()},
  back(){S.room=null;render()},
  take(){
    const td=todayDoses();if(S.room===null||td.filter(x=>x[0]===S.room).length>=MAXD)return;
    const e=S.room,k=S.cur[e]||0;S.log={[key(new Date())]:td.concat([[e,k]])};S.cur[e]=k+1;save();render();
  },
  go(){if(done())return;S.days.push(key(new Date()));S.days=S.days.slice(-60);st.set('sanad_days',JSON.stringify(S.days));render()},
  sw(){S.swaps++;render()},
  edit(){openDlg()},
  wipe(){['sanad_user','sanad_days','sanad_guest','sanad_log','sanad_cur','sanad_loc'].forEach(st.del);loc=null;S.user=null;S.days=[];S.log={};S.cur={};render();openDlg()}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&act[b.dataset.a])act[b.dataset.a](b.dataset.v)});
document.addEventListener('change',e=>{if(e.target.id==='lang'||e.target.id==='langTop'){S.lang=e.target.value;st.set('sanad_lang',S.lang);render();scheduleRem()}});

fr:['Envoyez un message chaleureux à un ami à qui vous n’avez pas parlé depuis longtemps.','Faites une invocation sincère et discrète pour un proche.','Lisez lentement une page du Coran et méditez un verset.','Pardonnez dans votre cœur à quelqu’un qui vous a blessé.','Retirez un danger du chemin et espérez la récompense d’Allah.','Souriez et saluez chaleureusement chaque personne rencontrée aujourd’hui.','Aidez quelqu’un à porter quelque chose ou à finir une tâche, sans qu’on vous le demande.','Dites « astaghfirullah » 100 fois, le cœur présent.','Rendez visite à un malade ou appelez-le, ou envoyez-lui un message de réconfort.','Nourrissez un animal errant ou un oiseau, ou laissez de l’eau pour eux.','Passez 15 minutes sans téléphone avec vos parents ou votre famille.','Gardez votre langue aujourd’hui : ne dites de mal de personne, même si d’autres le font.','Remerciez quelqu’un qui vous a aidé dans le passé et dites-lui que cela compte encore.','Cédez votre place ou laissez quelqu’un passer devant vous dans une file.','Priez sur le Prophète ﷺ 100 fois.','Dites un mot d’encouragement à quelqu’un qui en a besoin.','Prenez des nouvelles d’un voisin et demandez-lui s’il a besoin de quelque chose.','Présentez des excuses sincères à quelqu’un que vous avez peut-être lésé.','Partagez un résumé ou un conseil d’étude utile avec un camarade ou un collègue.','Après chaque prière aujourd’hui : tasbih 33, tahmid 33 et takbir 34.','Asseyez-vous avec une personne âgée et écoutez ses histoires.','Quand la colère monte, faites une pause et dites « Je cherche refuge auprès d’Allah contre Satan le banni ».','Appelez un proche que vous n’avez pas visité et prenez de ses nouvelles.','Laissez quelqu’un parler jusqu’au bout et écoutez-le sans regarder votre téléphone.','Donnez une aumône aujourd’hui, même petite, ou offrez à quelqu’un votre temps.','Apprenez à quelqu’un une petite chose que vous maîtrisez.','Écrivez un mot de gratitude à un enseignant ou à quelqu’un qui vous a inspiré.', id:['Kirim pesan hangat kepada teman yang lama tak kamu hubungi.','Panjatkan doa tulus secara diam-diam untuk orang yang kamu sayangi.','Baca satu halaman Al-Qur’an perlahan dan renungkan satu ayat.','Maafkan dalam hatimu seseorang yang pernah menyakitimu.','Singkirkan gangguan dari jalan dan berharaplah pahala dari Allah.','Tersenyum dan sapa hangat setiap orang yang kamu temui hari ini.','Bantu seseorang membawa barang atau menyelesaikan tugas tanpa diminta.','Ucapkan “astaghfirullah” 100 kali dengan hati yang hadir.','Jenguk atau telepon orang yang sakit, atau kirim pesan penghiburan.','Beri makan hewan terlantar atau burung, atau sediakan air untuk mereka.','Luangkan 15 menit tanpa ponsel bersama orang tua atau keluargamu.','Jaga lisanmu hari ini: jangan menggunjing siapa pun, meski orang lain melakukannya.','Ucapkan terima kasih kepada orang yang pernah membantumu dan katakan bahwa itu masih berarti.','Berikan tempat dudukmu, atau persilakan seseorang mendahuluimu di antrean.','Bacalah selawat kepada Nabi ﷺ 100 kali.','Ucapkan kata penyemangat kepada seseorang yang membutuhkannya.','Tanyakan kabar tetanggamu dan tawarkan bantuan jika ia butuh sesuatu.','Minta maaf dengan tulus kepada orang yang mungkin pernah kamu zalimi.','Bagikan ringkasan atau tips belajar yang bermanfaat kepada teman atau rekan.','Setelah setiap salat hari ini: tasbih 33, tahmid 33, dan takbir 34.','Duduklah bersama orang lanjut usia dan dengarkan kisah-kisahnya.','Saat marah, berhenti sejenak dan ucapkan “A‘udzu billahi minasy-syaithanir-rajim”.','Telepon kerabat yang belum kamu kunjungi dan tanyakan kabarnya.','Biarkan seseorang berbicara sampai selesai dan dengarkan tanpa melihat ponsel.','Bersedekahlah hari ini, sekecil apa pun, atau berikan waktumu kepada seseorang.','Ajarkan kepada seseorang satu hal kecil yang kamu kuasai.','Tulis catatan terima kasih untuk guru atau orang yang menginspirasimu.','Kerjakan dua rakaat salat sunah di waktu yang tenang.','Bantu orang tua mengerjakan pekerjaan rumah tanpa diminta.','Bagikan makananmu atau berikan segelas air kepada seseorang.','Berprasangka baik kepada orang yang membuatmu kesal.','Berikan hadiah kecil, bahkan secangkir teh, sebagai tanda sayang.','Bantu mendamaikan dua orang yang berselisih, atau bicarakan keduanya dengan baik.','Tepati janji yang pernah kamu buat, sekecil apa pun.','Kembalikan barang yang kamu pinjam, atau tunaikan utang budi kecil.','Matikan notifikasi satu jam dan gunakan untuk berzikir atau merenung.','Sebutkan tiga nikmat yang kamu miliki dan syukuri masing-masing dengan lantang.','Beri semangat kepada anak kecil atau adik dengan kata-kata baik.','Berikan pakaian atau barang yang tak kamu perlukan kepada yang membutuhkan.','Bagikan ayat atau pengingat bermanfaat kepada seorang teman.','Makan bersama seseorang dan berbagi hidangan.','Hafalkan satu ayat pendek atau doa yang belum kamu hafal.','Pelajari makna satu Asmaul Husna dan renungkan.','Siram tanaman atau rawat sesuatu yang hidup.','Luangkan lima menit hening untuk merenungkan harimu dan apa yang bisa diperbaiki.','Semangati seseorang yang kesulitan dalam belajar atau pekerjaan.','Bersihkan ruang bersama (rumah, tempat kerja, atau masjid) tanpa diminta.','Jadilah yang pertama mengucap salam kepada seseorang hari ini.','Bicaralah dengan ramah kepada orang yang melayanimu (sopir, penjual, petugas kebersihan) dan ucapkan terima kasih.','Syukuri hari baru dengan doa tulus dan niatkan satu kebaikan.']};

const qt=()=>QT[S.lang]||QT.en;
const KAABA={lat:21.422487,lon:39.826206};
const d2r=x=>x*Math.PI/180,r2d=x=>x*180/Math.PI;
function qiblaBearing(la,lo){const p1=d2r(la),p2=d2r(KAABA.lat),dl=d2r(KAABA.lon-lo);
  return (r2d(Math.atan2(Math.sin(dl)*Math.cos(p2),Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl)))+360)%360}
function distKm(la,lo){const p1=d2r(la),p2=d2r(KAABA.lat),dp=p2-p1,dl=d2r(KAABA.lon-lo);
  const a=Math.sin(dp/2)*Math.sin(dp/2)+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)*Math.sin(dl/2);return 2*6371*Math.asin(Math.sqrt(a))}
function headingFrom(al,be,ga){const a=d2r(al),b=d2r(be),g=d2r(ga);
  if(Math.abs(be)<50)return (r2d(Math.atan2(-Math.sin(a)*Math.cos(b),Math.cos(a)*Math.cos(b)))+360)%360;
  const rA=-Math.cos(a)*Math.sin(g)-Math.sin(a)*Math.sin(b)*Math.cos(g),rB=-Math.sin(a)*Math.sin(g)+Math.cos(a)*Math.sin(b)*Math.cos(g);
  return (r2d(Math.atan2(rA,rB))+360)%360}
let loc=parse('sanad_loc',null),qBusy=false,qMsg='',heading=null,compassOn=false,qNoCmp=false,wasOk=false,cmpTimer=null;
const GEO=()=>window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Geolocation;
async function getLoc(manual){
  if(qBusy)return;qBusy=true;if(manual||!loc){qMsg='';render()}
  try{
    let c;const G=GEO();
    if(G){
      let p=await G.checkPermissions();
      if(p.location!=='granted'&&p.coarseLocation!=='granted')p=await G.requestPermissions();
      if(p.location!=='granted'&&p.coarseLocation!=='granted'){if(manual||!loc)qMsg=qt().denied;qBusy=false;render();return}
      c=(await G.getCurrentPosition({enableHighAccuracy:true,timeout:20000,maximumAge:0})).coords;
    }else if(navigator.geolocation){
      c=(await new Promise((ok,no)=>navigator.geolocation.getCurrentPosition(ok,no,{enableHighAccuracy:true,timeout:20000,maximumAge:60000}))).coords;
    }else{if(manual||!loc)qMsg=qt().fail;qBusy=false;render();return}
    loc={lat:c.latitude,lon:c.longitude,acc:c.accuracy,ts:Date.now()};st.set('sanad_loc',JSON.stringify(loc));qMsg='';
  }catch(e){if(manual||!loc)qMsg=(e&&(e.code===1||/denied|permission/i.test(String(e.message||e))))?qt().denied:qt().fail}
  qBusy=false;render();
}
function onOri(e){
  let h=null;
  if(typeof e.webkitCompassHeading==='number')h=e.webkitCompassHeading;
  else if(e.type==='deviceorientationabsolute'||e.absolute===true){
    if(typeof e.alpha==='number'&&typeof e.beta==='number'&&typeof e.gamma==='number')h=headingFrom(e.alpha,e.beta,e.gamma);
    else if(typeof e.alpha==='number')h=(360-e.alpha)%360}
  if(h===null||isNaN(h))return;
  if(heading===null)heading=h;else{const dl=((h-heading+540)%360)-180;heading=(heading+dl*0.25+360)%360}
  qNoCmp=false;updateCompassUI();
}
async function startCompass(gesture){
  if(compassOn)return;
  try{if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
    if(!gesture)return;
    const r=await DeviceOrientationEvent.requestPermission();if(r!=='granted'){qNoCmp=true;render();return}}}catch(e){}
  window.addEventListener('deviceorientationabsolute',onOri,true);window.addEventListener('deviceorientation',onOri,true);
  compassOn=true;clearTimeout(cmpTimer);cmpTimer=setTimeout(()=>{if(heading===null){qNoCmp=true;render()}},3000);
  if(gesture)render();
}
function stopCompass(){if(!compassOn)return;
  window.removeEventListener('deviceorientationabsolute',onOri,true);window.removeEventListener('deviceorientation',onOri,true);
  compassOn=false;heading=null;clearTimeout(cmpTimer)}
function updateCompassUI(){const d=$('qDial');if(!d||!loc||heading===null)return;
  d.style.transform='rotate('+(-heading)+'deg)';
  const dd=(((qiblaBearing(loc.lat,loc.lon)-heading)%360)+360)%360,diff=Math.min(dd,360-dd),ok=diff<=5;
  d.classList.toggle('ok',ok);const s=$('qState');if(s)s.textContent=ok?qt().ok:qt().hint;
  if(ok&&!wasOk&&navigator.vibrate){try{navigator.vibrate(40)}catch(e){}}wasOk=ok}
function syncCompass(){if(S.tab==='qibla'&&S.room===null&&loc)startCompass(false);else stopCompass();updateCompassUI()}
function qiblaHTML(){const q=qt();let h=`<section class="card"><div class="t">${q.t}</div>`;
  if(!loc){return h+`<p class="s">${qBusy?q.wait:q.need}</p><button class="go" data-a="qloc" ${qBusy?'disabled':''}>${q.upd}</button>${qMsg?`<p class="limit">${qMsg}</p>`:''}<div class="note">${q.priv}</div></section>`}
  const qb=qiblaBearing(loc.lat,loc.lon),km=Math.round(distKm(loc.lat,loc.lon)).toLocaleString(L[S.lang].loc);
  const state=qNoCmp?q.nocmp:(heading===null&&compassOn)?q.reading:q.hint;
  return h+`<div class="qwrap"><div class="qtop">▲</div><div class="dial" id="qDial"><span class="qn">N</span><div class="qpt" style="transform:rotate(${qb}deg)"><div class="qline"></div><div class="qk">🕋</div></div></div></div>`+
   `<div class="qinfo"><div><b>${Math.round(qb)}°</b><small>${q.brg}</small></div><div><b>${km}</b><small>${q.dst} (km)</small></div></div>`+
   `<p class="s qstate" id="qState">${state}</p><div class="qcoord">${loc.lat.toFixed(4)}, ${loc.lon.toFixed(4)}${loc.acc?' · ±'+Math.round(loc.acc)+' m':''}</div>`+
   (!compassOn?`<button class="sw" data-a="qcmp">${q.cmp}</button>`:'')+`<button class="sw" data-a="qloc" ${qBusy?'disabled':''}>${qBusy?q.wait:q.upd}</button>`+
   (qMsg?`<p class="limit">${qMsg}</p>`:'')+`<div class="note">${q.note}</div><div class="note">${q.priv}</div><button class="ghost" data-a="qdel">${q.del}</button></section>`}
act.qloc=()=>getLoc(true);act.qcmp=()=>startCompass(true);
act.qdel=()=>{st.del('sanad_loc');loc=null;stopCompass();render()};

id:["Dosis hari ini sudah siap 🌿 Datang dan tenangkan hatimu","Jejak kebaikan hari ini menunggumu ✨ kebaikan kecil yang berbekas","Jangan putus rangkaianmu 🔥 tugas hari ini menunggu","“Ingatlah, hanya dengan mengingat Allah hati menjadi tenteram.” 🌙","Kami merindukanmu 🤍 Sanad menunggumu"]};
const rem=parse('sanad_rem',{on:false,t:'20:00'});
const LN=()=>window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.LocalNotifications;
let remNote='';
function remCard(){const r=RT[S.lang];
  return `<section class="card"><div class="t">${r.t}</div>`+(LN()?`<label class="remrow"><input type="checkbox" id="remOn" ${rem.on?'checked':''}> ${r.on}</label><div class="s" style="margin:8px 0 6px">${r.at}</div><input type="time" id="remTime" value="${rem.t}"><button class="sw" data-a="remtest">${r.test}</button>${remNote?`<p class="limit">${remNote}</p>`:''}`:`<p class="s">${r.none}</p>`)+`</section>`}
const REM_CH='sanad_reminders';
const remBody=i=>{const M=REM_MSG[S.lang],m=M[(dayNo()+i)%M.length],n=S.user&&S.user.name;return n&&!/^[﴿“«]/.test(m)?(isAr()?'يا '+n+'، ':n+', ')+m:m};
async function askPerm(P){let p=await P.checkPermissions();if(p.display!=='granted')p=await P.requestPermissions();if(p.display==='granted'){try{await P.createChannel({id:REM_CH,name:'تذكيرات سَنَد',description:'Sanad reminders',importance:5,visibility:1,vibration:true,lights:true,lightColor:'#8B6BFF'})}catch(e){}}return p.display==='granted'}
async function scheduleRem(){const P=LN();if(!P)return;
  try{await P.cancel({notifications:Array.from({length:30},(_,i)=>({id:i+1}))})}catch(e){}
  if(!rem.on)return;
  try{
    if(!await askPerm(P)){rem.on=false;st.set('sanad_rem',JSON.stringify(rem));remNote=RT[S.lang].denied;return}
    const hm=rem.t.split(':').map(Number),M=REM_MSG[S.lang],now=new Date(),list=[];
    for(let i=0;i<14;i++){const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()+i,hm[0],hm[1],0);if(d<=now)continue;
      list.push({id:i+1,title:'سَنَد',body:remBody(i),largeBody:remBody(i),summaryText:'سَنَد',channelId:REM_CH,smallIcon:'ic_stat_icon_config_sample',iconColor:'#8B6BFF',autoCancel:true,schedule:{at:d,allowWhileIdle:true}})}
    if(list.length)await P.schedule({notifications:list});
  }catch(e){}}
act.remtest=async()=>{const P=LN();if(!P)return;
  try{if(!await askPerm(P)){remNote=RT[S.lang].denied;render();return}
    await P.schedule({notifications:[{id:99,title:'سَنَد',body:remBody(0),largeBody:remBody(0),summaryText:'سَنَد',channelId:REM_CH,smallIcon:'ic_stat_icon_config_sample',iconColor:'#8B6BFF',autoCancel:true,schedule:{at:new Date(Date.now()+5000),allowWhileIdle:true}}]})}catch(e){}};
document.addEventListener('change',async e=>{
  if(e.target.id==='remOn'){rem.on=e.target.checked;remNote='';st.set('sanad_rem',JSON.stringify(rem));await scheduleRem();render()}
  else if(e.target.id==='remTime'&&e.target.value){rem.t=e.target.value;st.set('sanad_rem',JSON.stringify(rem));await scheduleRem()}});

/* ===== Profile (local only: no server, no password) ===== */
function openDlg(){
  const u=L[S.lang].ui;
  $('dT').textContent=u.dT;$('dS').textContent=u.dS;$('nm').placeholder=u.nm;$('em').placeholder=u.em;
  $('dN').textContent=u.dN;$('dSave').textContent=u.save;$('dGuest').textContent=u.guest;
  $('nm').value=S.user?S.user.name||'':'';$('em').value=S.user?S.user.email||'':'';
  if(!$('dlg').open)$('dlg').showModal();
}
$('dSave').onclick=()=>{
  const name=$('nm').value.trim(),email=$('em').value.trim();
  if(!name){$('nm').focus();return}
  if(email&&!$('em').checkValidity()){$('em').focus();return}
  S.user={name,email};st.set('sanad_user',JSON.stringify(S.user));$('dlg').close();render();
};
$('dGuest').onclick=()=>{st.set('sanad_guest','1');$('dlg').close()};

render();
scheduleRem();
(function(){const sp=$('splash');let gone=false;const end=()=>{if(gone)return;gone=true;sp.classList.add('out');setTimeout(()=>{sp.remove();if(!S.user&&!st.get('sanad_guest'))openDlg()},700)};sp.addEventListener('click',end);setTimeout(end,4500)})();
</script>
</body>
