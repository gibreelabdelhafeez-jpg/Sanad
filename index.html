<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0626">
<title>سَنَد | Sanad</title>
<link rel="icon" href="">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Amiri:wght@700&display=swap" rel="stylesheet">
<style>
:root{--sat:max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px));--sab:max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px));--bg1:#0a0626;--bg2:#1b0f66;--brand:#1800ad;--vio:#8b6bff;--gold:#fbbf24;--mint:#34d399;--text:#f5f3ff;--muted:#a9a3d6;--glass:rgba(255,255,255,.07);--line:rgba(255,255,255,.12)}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif}
body{background:radial-gradient(120% 70% at 50% 0%,var(--bg2),var(--bg1) 70%) fixed;color:var(--text);min-height:100dvh;display:flex;justify-content:center;padding:16px;padding-top:max(16px,var(--sat));overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(2px 2px at 12% 18%,#fff8,transparent),radial-gradient(2px 2px at 78% 12%,#fff9,transparent),radial-gradient(1.5px 1.5px at 40% 30%,#fff7,transparent),radial-gradient(2px 2px at 88% 40%,#fbbf24aa,transparent),radial-gradient(1.5px 1.5px at 20% 62%,#fff6,transparent),radial-gradient(2px 2px at 64% 78%,#fff7,transparent);animation:tw 5s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.4}to{opacity:1}}
.app{position:relative;width:100%;max-width:460px;display:flex;flex-direction:column;gap:16px;padding-bottom:calc(96px + var(--sab))}
.bar{display:flex;align-items:center;gap:10px;padding:4px 2px}
.bar .mini{width:40px;height:40px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none}
.bar .mini img{width:28px}
.bar h2{font-size:1.15rem;font-weight:800}
.back{background:var(--glass);border:1px solid var(--line);color:var(--text);width:38px;height:38px;border-radius:50%;font-size:1.1rem;cursor:pointer;flex:none}
.top{display:flex;justify-content:space-between;align-items:center}.top select{width:auto;margin:0;padding:7px 14px;border-radius:20px;font-size:.85rem}.avatar{width:38px;height:38px;border-radius:50%;background:var(--glass);border:1px solid var(--line);color:var(--text);font-weight:800;cursor:pointer}
.hero{text-align:center;padding:6px 0 2px}
.logo{position:relative;width:140px;height:140px;margin:0 auto 10px;display:grid;place-items:center}
.logo::before,.logo::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--vio);opacity:.5;animation:ring 3.2s ease-out infinite}
.logo::after{animation-delay:1.6s}
@keyframes ring{from{transform:scale(.85);opacity:.6}to{transform:scale(1.5);opacity:0}}
.logo .badge{width:124px;height:124px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 0 0 6px rgba(139,107,255,.25),0 18px 50px rgba(139,107,255,.45);animation:float 4s ease-in-out infinite}
.logo img{width:90px;height:auto}
@keyframes float{50%{transform:translateY(-6px)}}
.hero h1{font-size:1.8rem;font-weight:800}
.hero p{color:var(--muted);font-size:.9rem}
.hello{margin-top:6px;color:var(--gold);font-weight:700;font-size:.95rem;min-height:1.4em}
.card{background:var(--glass);border:1px solid var(--line);border-radius:24px;padding:18px;backdrop-filter:blur(14px);box-shadow:0 12px 36px rgba(0,0,0,.28)}
.t{font-size:1.05rem;font-weight:700;margin-bottom:4px}
.s{font-size:.84rem;color:var(--muted);margin-bottom:12px}
.orbs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.orb{--c:#8b6bff;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 24%,transparent),rgba(255,255,255,.03));border:1px solid color-mix(in srgb,var(--c) 45%,transparent);color:var(--text);padding:16px 12px;border-radius:18px;font-size:.92rem;font-weight:600;cursor:pointer;text-align:start;transition:.25s}
.orb:hover{transform:translateY(-3px);box-shadow:0 8px 22px color-mix(in srgb,var(--c) 40%,transparent)}
.orb small{display:block;font-size:.72rem;color:var(--muted);margin-top:4px}.orb.shut{opacity:.55}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.ayah{font-family:'Amiri','Traditional Arabic',serif;font-size:1.3rem;line-height:2;color:var(--gold);text-align:center;background:rgba(251,191,36,.08);border-radius:14px;padding:12px;direction:rtl;margin-top:8px}
.ref{font-size:.76rem;color:var(--muted);text-align:center;margin:4px 0 8px}
.tr{font-size:.86rem;text-align:center;color:#ddd8ff;margin-bottom:8px;line-height:1.7}
#splash{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;padding:max(28px,var(--sat)) 24px max(30px,var(--sab));background:radial-gradient(120% 70% at 50% 30%,#2a1a8f,#0a0626 70%);cursor:pointer;transition:opacity .7s ease,visibility .7s}
#splash.out{opacity:0;visibility:hidden}
#splash .mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;direction:rtl;animation:in 1.4s ease}
#splash .bsm{font-family:'Amiri','Traditional Arabic',serif;font-size:clamp(1.9rem,9vw,2.7rem);line-height:1.9;color:var(--gold);text-shadow:0 0 30px rgba(251,191,36,.4)}
#splash .orn{color:var(--vio);font-size:1.4rem;opacity:.8}
#splash .sdua{font-family:'Amiri','Traditional Arabic',serif;font-size:clamp(1.7rem,7.6vw,2.3rem);line-height:2.1;color:#fff;max-width:14em}
#splash .cr{direction:rtl;animation:in 2s ease}
#splash .cr b{display:block;font-size:1.25rem;font-weight:800;color:var(--text)}
#splash .cr small{display:block;font-size:.8rem;letter-spacing:3px;color:var(--muted);margin-top:2px}
.remrow{display:flex;align-items:center;gap:10px;font-size:.95rem}.remrow input{width:20px;height:20px;margin:0}
.tad{font-size:.84rem;line-height:1.8;color:#c7f9e5;background:rgba(52,211,153,.07);border-radius:12px;padding:8px 12px;margin-bottom:8px}
.dose{border-inline-start:4px solid var(--vio);animation:in .45s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.dose h3{font-size:.95rem;color:var(--vio);margin-bottom:8px}
.msg{font-size:.96rem;line-height:1.85;margin-bottom:10px}
.tag{display:inline-block;background:rgba(52,211,153,.16);color:var(--mint);font-size:.74rem;font-weight:700;padding:3px 10px;border-radius:12px;margin:8px 0 6px}
.story{font-size:.88rem;line-height:1.85;color:#d8d3ff;background:rgba(255,255,255,.04);padding:10px 12px;border-radius:12px}
.story b{display:block;margin-bottom:4px;color:#fff}
.lesson{font-size:.84rem;color:var(--mint);margin-top:6px}
.dua{font-size:.95rem;line-height:1.9;color:#a7f3d0;border-top:1px dashed var(--line);padding-top:10px;margin-top:10px;direction:rtl;font-family:'Amiri','Traditional Arabic',serif;font-size:1.1rem}
.duatr{font-family:'Cairo',sans-serif;direction:ltr;text-align:left;font-size:.84rem;color:#d1fae5;margin-top:4px;line-height:1.7}
.dtype{font-size:.74rem;color:var(--muted);font-family:'Cairo',sans-serif;direction:inherit}
.wird{font-size:.86rem;color:var(--gold);background:rgba(251,191,36,.07);padding:10px 12px;border-radius:14px}
.pips{display:flex;align-items:center;gap:8px;font-size:.84rem;color:var(--muted);margin-bottom:10px}
.pip{width:14px;height:14px;border-radius:50%;border:2px solid var(--vio)}.pip.f{background:var(--vio)}
.go{width:100%;background:linear-gradient(135deg,var(--vio),var(--brand));color:#fff;border:none;padding:14px;border-radius:14px;font-weight:700;font-size:.95rem;cursor:pointer}
.go:disabled,.go.done{background:#2d2a55;color:var(--muted);cursor:default}
.limit{font-size:.86rem;color:var(--gold);margin-top:10px;line-height:1.7}
.sw,.ghost{width:100%;background:var(--glass);color:var(--muted);border:1px solid var(--line);padding:12px;border-radius:14px;cursor:pointer;margin-top:8px}
.ghost{color:var(--vio);border-color:var(--vio);background:transparent}
.ihead{display:flex;justify-content:space-between;align-items:center}
.streak{background:rgba(251,191,36,.15);color:var(--gold);padding:4px 12px;border-radius:20px;font-size:.8rem;font-weight:700}
.week{display:flex;justify-content:space-between;margin:4px 0 14px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.7rem;color:var(--muted)}
.dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.8rem}
.dot.ok{background:linear-gradient(135deg,var(--vio),var(--brand));border-color:var(--vio);color:#fff}.dot.now{border-color:var(--gold)}
.ch{font-size:.98rem;line-height:1.85;background:rgba(255,255,255,.05);padding:16px;border-radius:16px;margin-bottom:12px;border:1px dashed rgba(251,191,36,.35)}
select,input{width:100%;background:rgba(255,255,255,.08);color:var(--text);border:1px solid var(--line);padding:12px;border-radius:12px;font-size:.95rem;margin-bottom:10px;outline:none}
select option{color:#111}
.who{font-weight:700;margin-bottom:2px}.mail{font-size:.84rem;color:var(--muted);margin-bottom:8px}
.note{font-size:.76rem;color:var(--gold);margin:6px 0}
.tabs{position:fixed;bottom:max(12px,var(--sab));left:50%;transform:translateX(-50%);width:min(calc(100% - 32px),428px);display:flex;gap:4px;background:rgba(21,13,85,.85);border:1px solid var(--line);backdrop-filter:blur(16px);border-radius:24px;padding:6px;z-index:5}
.tab{flex:1;background:none;border:none;color:var(--muted);padding:8px 4px;border-radius:18px;font-size:.74rem;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.tab span{font-size:1.2rem}.tab.on{background:linear-gradient(135deg,var(--vio),var(--brand));color:#fff}
.view{display:none;flex-direction:column;gap:16px}.view.on{display:flex}
dialog{margin:auto;border:1px solid var(--line);background:#150d55;color:var(--text);border-radius:24px;padding:22px;width:min(92vw,380px)}
dialog::backdrop{background:rgba(5,3,20,.7);backdrop-filter:blur(4px)}
dialog h2{font-size:1.15rem;margin-bottom:4px}dialog p{font-size:.84rem;color:var(--muted);margin-bottom:12px;line-height:1.7}
.row{display:flex;gap:8px}.row .sw{margin-top:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.qwrap{position:relative;width:min(78vw,300px);height:min(78vw,300px);margin:8px auto 4px}
.qtop{position:absolute;top:-4px;left:50%;transform:translateX(-50%);font-size:1.5rem;color:var(--gold);z-index:2;line-height:1}
.dial{position:absolute;inset:16px;border-radius:50%;border:2px solid var(--line);background:radial-gradient(circle,rgba(139,107,255,.16),rgba(255,255,255,.03))}
.dial.ok{border-color:var(--mint);box-shadow:0 0 30px rgba(52,211,153,.5)}
.qn{position:absolute;top:6px;left:50%;transform:translateX(-50%);font-weight:800;color:#fca5a5;font-size:.9rem}
.qpt{position:absolute;left:50%;top:50%;width:0;height:0}
.qline{position:absolute;left:-1px;bottom:0;width:2px;height:min(33vw,124px);background:linear-gradient(to top,rgba(251,191,36,0),#fbbf24)}
.qk{position:absolute;left:-16px;bottom:min(33vw,124px);width:32px;text-align:center;font-size:1.7rem;line-height:1}
.qinfo{display:flex;justify-content:space-around;text-align:center;margin:10px 0}.qinfo b{display:block;font-size:1.3rem}.qinfo small{color:var(--muted);font-size:.74rem}
.qstate{text-align:center;margin:8px 0}.qcoord{text-align:center;font-size:.74rem;color:var(--muted);direction:ltr;margin-bottom:6px}
</style>
</head>
<body>
<div id="splash" role="dialog" aria-label="بسم الله">
  <div></div>

<div class="app">

</div>

</dialog>

{v:["﴿أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ﴾|الرعد: 28","﴿لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا﴾|البقرة: 286","﴿وَلَقَدْ خَلَقْنَا الْإِنسَانَ وَنَعْلَمُ مَا تُوَسْوِسُ بِهِ نَفْسُهُ﴾|ق: 16","﴿وَهُوَ مَعَكُمْ أَيْنَ مَا كُنتُمْ﴾|الحديد: 4","﴿فَإِنَّ مَعَ الْعُسْرِ يُسْرًا ۝ إِنَّ مَعَ الْعُسْرِ يُسْرًا﴾|الشرح: 5-6","﴿وَاصْبِرْ وَمَا صَبْرُكَ إِلَّا بِاللَّهِ﴾|النحل: 127","﴿وَاسْتَعِينُوا بِالصَّبْرِ وَالصَّلَاةِ﴾|البقرة: 45","﴿هُوَ الَّذِي أَنزَلَ السَّكِينَةَ فِي قُلُوبِ الْمُؤْمِنِينَ﴾|الفتح: 4","﴿وَلَا تَهِنُوا وَلَا تَحْزَنُوا﴾|آل عمران: 139","﴿وَاذْكُر رَّبَّكَ إِذَا نَسِيتَ﴾|الكهف: 24","﴿فَإِذَا فَرَغْتَ فَانصَبْ ۝ وَإِلَىٰ رَبِّكَ فَارْغَب﴾|الشرح: 7-8","﴿وَمَن يَتَّقِ اللَّهَ يَجْعَل لَّهُ مِنْ أَمْرِهِ يُسْرًا﴾|الطلاق: 4","﴿وَهُوَ أَرْحَمُ الرَّاحِمِينَ﴾|يوسف: 64","﴿إِنَّ اللَّهَ مَعَ الصَّابِرِينَ﴾|البقرة: 153","﴿أَلَمْ نَشْرَحْ لَكَ صَدْرَكَ﴾|الشرح: 1"],
 s:[["موسى عليه السلام أمام المهمة الصعبة","حين كُلّف موسى عليه السلام بمواجهة فرعون، سأل الله أن يشرح صدره وييسر أمره.","﴿رَبِّ اشْرَحْ لِي صَدْرِي ۝ وَيَسِّرْ لِي أَمْرِي﴾|طه: 25-26","حتى لو كانت المهمة أكبر مما تتصور، ابدأ بطلب العون من الله.","q"],
    ["أصحاب الكهف","شباب واجهوا واقعاً صعباً وضغطاً كبيراً، فلجؤوا إلى الله وطلبوا منه الرحمة والرشد.","﴿رَبَّنَا آتِنَا مِن لَّدُنكَ رَحْمَةً وَهَيِّئْ لَنَا مِنْ أَمْرِنَا رَشَدًا﴾|الكهف: 10","عندما لا تعرف الطريق، اطلب من الله أن يدلك عليه.","q"],
    ["النبي ﷺ في الغار","كان النبي ﷺ وأبو بكر رضي الله عنه في الغار والخطر قريب، فقال له النبي ﷺ ما يطمئنه.","﴿لَا تَحْزَنْ إِنَّ اللَّهَ مَعَنَا﴾|التوبة: 40","قد تضيق الظروف، لكن معية الله أعظم من كل ما تخشاه.","w"],
    ["سبب نزول: ﴿لا يكلف الله نفساً إلا وسعها﴾","لمّا نزلت ﴿وإن تبدوا ما في أنفسكم أو تخفوه يحاسبكم به الله﴾ اشتد ذلك على الصحابة، فجاؤوا النبي ﷺ وقالوا إنهم لا يطيقونها. ثم أنزل الله ﴿لا يكلف الله نفساً إلا وسعها﴾ تخفيفاً عليهم. (رواه مسلم)","","الله لا يحمّلك فوق طاقتك أبداً.","s"]],
 d:[["اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ، وَالْعَجْزِ وَالْكَسَلِ، وَالْجُبْنِ وَالْبُخْلِ، وَضَلَعِ الدَّيْنِ وَغَلَبَةِ الرِّجَالِ","n","صحيح البخاري"],["رَبِّ اشْرَحْ لِي صَدْرِي وَيَسِّرْ لِي أَمْرِي","q","طه: 25-26"],["اللَّهُمَّ أَعِنِّي وَلَا تُعِنْ عَلَيَّ، وَانْصُرْنِي وَلَا تَنْصُرْ عَلَيَّ، وَاهْدِنِي وَيَسِّرِ الْهُدَى لِي","n","سنن أبي داود والترمذي"],["يَا حَيُّ يَا قَيُّومُ بِرَحْمَتِكَ أَسْتَغِيثُ، أَصْلِحْ لِي شَأْنِي كُلَّهُ وَلَا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ","n","سنن الترمذي"],["اللَّهُمَّ إِنِّي أَسْأَلُكَ رَاحَةً فِي الْقَلْبِ، وَسَكِينَةً فِي النَّفْسِ، وَبَرَكَةً فِي الْوَقْتِ، وَتَيْسِيرًا فِي الأَمْرِ","s",""]],
 w:"سورة الشرح + أذكار السكينة",msg:"ليس عليك أن تحمل كل شيء دفعة واحدة. خذ بالأسباب واستعن بالله."},
{v:["﴿وَعَسَىٰ أَن تَكْرَهُوا شَيْئًا وَهُوَ خَيْرٌ لَّكُمْ﴾|البقرة: 216","﴿وَمَن يَتَوَكَّلْ عَلَى اللَّهِ فَهُوَ حَسْبُهُ﴾|الطلاق: 3","﴿وَعِندَهُ مَفَاتِحُ الْغَيْبِ لَا يَعْلَمُهَا إِلَّا هُوَ﴾|الأنعام: 59","﴿وَمَا مِن دَابَّةٍ فِي الْأَرْضِ إِلَّا عَلَى اللَّهِ رِزْقُهَا﴾|هود: 6","﴿لَا تَدْرِي لَعَلَّ اللَّهَ يُحْدِثُ بَعْدَ ذَٰلِكَ أَمْرًا﴾|الطلاق: 1","﴿قُل لَّن يُصِيبَنَا إِلَّا مَا كَتَبَ اللَّهُ لَنَا هُوَ مَوْلَانَا﴾|التوبة: 51","﴿وَمَا تَوْفِيقِي إِلَّا بِاللَّهِ﴾|هود: 88","﴿نَّحْنُ نَرْزُقُهُمْ وَإِيَّاكُمْ﴾|الإسراء: 31","﴿إِنَّ رَبِّي لَطِيفٌ لِّمَا يَشَاءُ﴾|يوسف: 100","﴿وَاللَّهُ خَيْرٌ وَأَبْقَىٰ﴾|طه: 73","﴿أَلَيْسَ اللَّهُ بِكَافٍ عَبْدَهُ﴾|الزمر: 36","﴿وَلِلَّهِ غَيْبُ السَّمَاوَاتِ وَالْأَرْضِ وَإِلَيْهِ يُرْجَعُ الْأَمْرُ كُلُّهُ﴾|هود: 123","﴿فَإِذَا عَزَمْتَ فَتَوَكَّلْ عَلَى اللَّهِ﴾|آل عمران: 159","﴿وَلَا تَيْأَسُوا مِن رَّوْحِ اللَّهِ﴾|يوسف: 87","﴿وَكَفَىٰ بِاللَّهِ وَكِيلًا﴾|النساء: 81","﴿وَتَوَكَّلْ عَلَى الْحَيِّ الَّذِي لَا يَمُوتُ﴾|الفرقان: 58"],
 s:[["يوسف عليه السلام: مستقبل لم يكن متوقعاً","أُلقي يوسف في البئر، ثم بيع، ثم دخل السجن. لكن القصة لم تنتهِ هناك؛ فقد صار عزيز مصر واجتمع بأهله بعد سنوات من الفراق. (سورة يوسف)","","لا تحكم على مستقبلك من واقعك الحالي؛ قد تكون أحداث لا تفهم حكمتها اليوم جزءاً من طريق لم تتخيله.","q"],
    ["أم موسى عليه السلام","وضعت ابنها في صندوق وألقته في اليم بأمر الله رغم أن ظاهر الموقف مخيف، لكن الله أعاده إليها.","﴿فَرَدَدْنَاهُ إِلَىٰ أُمِّهِ كَيْ تَقَرَّ عَيْنُهَا وَلَا تَحْزَنَ﴾|القصص: 13","قد يكون تدبير الله لك أعظم من قدرتك على تصور النجاة.","q"],
    ["إبراهيم عليه السلام","ترك إبراهيم أهله في وادٍ غير ذي زرع وتوجّه إلى الله بالدعاء.","﴿رَّبَّنَا إِنِّي أَسْكَنتُ مِن ذُرِّيَّتِي بِوَادٍ غَيْرِ ذِي زَرْعٍ﴾|إبراهيم: 37","عندما تعجز عن التحكم في الظروف، لا تعجز عن الدعاء.","q"],
    ["النبي ﷺ وأبو بكر في الغار","وقف المشركون على باب الغار، فقال أبو بكر: لو نظر أحدهم تحت قدميه لرآنا! فقال النبي ﷺ: «ما ظنك باثنين الله ثالثهما؟» (رواه البخاري)","","اليقين بالله يحوّل الخوف إلى سكينة.","w"]],
 d:[["اللَّهُمَّ إِنِّي أَسْأَلُكَ خَيْرَ هَذَا الأَمْرِ وَخَيْرَ مَا بَعْدَهُ، وَأَعُوذُ بِكَ مِنْ شَرِّهِ وَشَرِّ مَا بَعْدَهُ","s",""],["اللَّهُمَّ أَسْلَمْتُ نَفْسِي إِلَيْكَ وَفَوَّضْتُ أَمْرِي إِلَيْكَ ... لَا مَلْجَأَ وَلَا مَنْجَى مِنْكَ إِلَّا إِلَيْكَ","n","متفق عليه"],["رَبَّنَا آتِنَا مِن لَّدُنكَ رَحْمَةً وَهَيِّئْ لَنَا مِنْ أَمْرِنَا رَشَدًا","q","الكهف: 10"],["رَبِّ إِنِّي لِمَا أَنزَلْتَ إِلَيَّ مِنْ خَيْرٍ فَقِيرٌ","q","القصص: 24"],["اللَّهُمَّ إِنِّي أَسْأَلُكَ التَّوْفِيقَ وَالسَّدَادَ، وَأَنْ تَجْعَلَ الْقَادِمَ مِنْ أَيَّامِي خَيْرًا مِمَّا مَضَى","s",""]],

{v:["﴿إِنَّمَا أَشْكُو بَثِّي وَحُزْنِي إِلَى اللَّهِ﴾|يوسف: 86","﴿وَلَا تَهِنُوا وَلَا تَحْزَنُوا وَأَنتُمُ الْأَعْلَوْنَ إِن كُنتُم مُّؤْمِنِينَ﴾|آل عمران: 139","﴿مَا وَدَّعَكَ رَبُّكَ وَمَا قَلَىٰ﴾|الضحى: 3","﴿وَلَسَوْفَ يُعْطِيكَ رَبُّكَ فَتَرْضَىٰ﴾|الضحى: 5","﴿لَا تَحْزَنْ إِنَّ اللَّهَ مَعَنَا﴾|التوبة: 40","﴿وَلَا تَيْأَسُوا مِن رَّوْحِ اللَّهِ﴾|يوسف: 87","﴿وَبَشِّرِ الصَّابِرِينَ﴾|البقرة: 155","﴿إِنَّ مَعَ الْعُسْرِ يُسْرًا﴾|الشرح: 6","﴿وَاصْبِرْ لِحُكْمِ رَبِّكَ فَإِنَّكَ بِأَعْيُنِنَا﴾|الطور: 48","﴿وَهُوَ أَرْحَمُ الرَّاحِمِينَ﴾|يوسف: 64","﴿وَهُوَ الَّذِي يُنَزِّلُ الْغَيْثَ مِن بَعْدِ مَا قَنَطُوا﴾|الشورى: 28","﴿فَإِنِّي قَرِيبٌ أُجِيبُ دَعْوَةَ الدَّاعِ إِذَا دَعَانِ﴾|البقرة: 186","﴿وَلَقَدْ نَعْلَمُ أَنَّكَ يَضِيقُ صَدْرُكَ بِمَا يَقُولُونَ﴾|الحجر: 97","﴿فَسَبِّحْ بِحَمْدِ رَبِّكَ وَكُن مِّنَ السَّاجِدِينَ﴾|الحجر: 98","﴿وَلَا تَحْزَنْ عَلَيْهِمْ وَلَا تَكُن فِي ضَيْقٍ مِّمَّا يَمْكُرُونَ﴾|النمل: 70"],
 s:[["يعقوب عليه السلام: حزن لا ينقطع معه الرجاء","فقد يعقوب ابنه يوسف واشتد عليه الحزن حتى ابيضّت عيناه، لكنه لم يفقد ثقته بالله.","﴿إِنَّمَا أَشْكُو بَثِّي وَحُزْنِي إِلَى اللَّهِ﴾|يوسف: 86","ليس عليك أن تتظاهر بالقوة دائماً؛ يمكنك أن تشكو حزنك إلى الله.","q"],
    ["أيوب عليه السلام: حين يطول الابتلاء","ابتُلي أيوب عليه السلام وظل متعلقاً بربه، فاستجاب الله له وكشف ما به من ضر.","﴿أَنِّي مَسَّنِيَ الضُّرُّ وَأَنتَ أَرْحَمُ الرَّاحِمِينَ﴾|الأنبياء: 83","طول البلاء لا يعني غياب رحمة الله.","q"],
    ["يونس عليه السلام: في ظلمات ثلاث","كان يونس في ظلمة البحر والليل وبطن الحوت، لكنه لم يفقد باب الدعاء.","﴿لَّا إِلَٰهَ إِلَّا أَنتَ سُبْحَانَكَ إِنِّي كُنتُ مِنَ الظَّالِمِينَ﴾|الأنبياء: 87","حتى في أعمق نقطة من الحزن، يظل باب الله مفتوحاً.","q"],
    ["مريم عليها السلام","عندما اشتد عليها المخاض ووجدت نفسها في موقف شديد، جاءها التثبيت والتطمين الإلهي.","﴿أَلَّا تَحْزَنِي قَدْ جَعَلَ رَبُّكِ تَحْتَكِ سَرِيًّا﴾|مريم: 24","قد تأتي الرحمة في أكثر اللحظات التي تظن فيها أنك وحدك.","q"],
    ["سبب نزول سورة الضحى","اشتكى النبي ﷺ فلم يقم ليلة أو ليلتين، فجاءته امرأة فقالت: يا محمد، ما أرى شيطانك إلا قد تركك! فأنزل الله ﴿والضحى والليل إذا سجى ما ودعك ربك وما قلى﴾. (متفق عليه)","","ربك لم يتركك ولن يتركك.","s"]],
 d:[["اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ، وَالْعَجْزِ وَالْكَسَلِ، وَالْجُبْنِ وَالْبُخْلِ، وَضَلَعِ الدَّيْنِ وَغَلَبَةِ الرِّجَالِ","n","صحيح البخاري"],["لَّا إِلَٰهَ إِلَّا أَنتَ سُبْحَانَكَ إِنِّي كُنتُ مِنَ الظَّالِمِينَ","q","الأنبياء: 87"],["يَا حَيُّ يَا قَيُّومُ بِرَحْمَتِكَ أَسْتَغِيثُ","n","سنن الترمذي"],["رَبَّنَا أَفْرِغْ عَلَيْنَا صَبْرًا وَتَوَفَّنَا مُسْلِمِينَ","q","الأعراف: 126"],["رَبَّنَا لَا تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا وَهَبْ لَنَا مِن لَّدُنكَ رَحْمَةً","q","آل عمران: 8"],["رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ","q","البقرة: 201"],["اللَّهُمَّ إِنِّي عَبْدُكَ ابْنُ عَبْدِكَ ابْنُ أَمَتِكَ ... أَنْ تَجْعَلَ الْقُرْآنَ رَبِيعَ قَلْبِي، وَنُورَ صَدْرِي، وَجَلَاءَ حُزْنِي، وَذَهَابَ هَمِّي","n","مسند أحمد (صححه عدد من أهل العلم)"]],
 w:"سورة يوسف + دعاء يونس",msg:"يمكنك أن تتحدث إلى الله بما لا تستطيع أن تقوله لأحد."},
{v:["﴿قُلْ يَا عِبَادِيَ الَّذِينَ أَسْرَفُوا عَلَىٰ أَنفُسِهِمْ لَا تَقْنَطُوا مِن رَّحْمَةِ اللَّهِ﴾|الزمر: 53","﴿إِنَّ اللَّهَ يُحِبُّ التَّوَّابِينَ وَيُحِبُّ الْمُتَطَهِّرِينَ﴾|البقرة: 222","﴿وَهُوَ الَّذِي يَقْبَلُ التَّوْبَةَ عَنْ عِبَادِهِ﴾|الشورى: 25","﴿إِنَّ رَبِّي قَرِيبٌ مُّجِيبٌ﴾|هود: 61","﴿وَمَن يَعْمَلْ سُوءًا أَوْ يَظْلِمْ نَفْسَهُ ثُمَّ يَسْتَغْفِرِ اللَّهَ يَجِدِ اللَّهَ غَفُورًا رَّحِيمًا﴾|النساء: 110","﴿إِنَّ الْحَسَنَاتِ يُذْهِبْنَ السَّيِّئَاتِ﴾|هود: 114","﴿وَالَّذِينَ إِذَا فَعَلُوا فَاحِشَةً أَوْ ظَلَمُوا أَنفُسَهُمْ ذَكَرُوا اللَّهَ فَاسْتَغْفَرُوا لِذُنُوبِهِمْ﴾|آل عمران: 135","﴿فَأُولَٰئِكَ يُبَدِّلُ اللَّهُ سَيِّئَاتِهِمْ حَسَنَاتٍ﴾|الفرقان: 70","﴿وَتُوبُوا إِلَى اللَّهِ جَمِيعًا أَيُّهَ الْمُؤْمِنُونَ لَعَلَّكُمْ تُفْلِحُونَ﴾|النور: 31","﴿وَأَن لَّيْسَ لِلْإِنسَانِ إِلَّا مَا سَعَىٰ﴾|النجم: 39","﴿وَقُلِ اعْمَلُوا فَسَيَرَى اللَّهُ عَمَلَكُمْ﴾|التوبة: 105","﴿وَالَّذِينَ جَاهَدُوا فِينَا لَنَهْدِيَنَّهُمْ سُبُلَنَا﴾|العنكبوت: 69","﴿فَاسْتَبِقُوا الْخَيْرَاتِ﴾|البقرة: 148","﴿فَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍ خَيْرًا يَرَهُ﴾|الزلزلة: 7"],
 s:[["آدم عليه السلام: الخطأ ليس نهاية الطريق","حين وقع آدم في المخالفة لم يستمر في الإعراض، بل تاب إلى الله.","﴿رَبَّنَا ظَلَمْنَا أَنفُسَنَا وَإِن لَّمْ تَغْفِرْ لَنَا وَتَرْحَمْنَا لَنَكُونَنَّ مِنَ الْخَاسِرِينَ﴾|الأعراف: 23","الاعتراف بالخطأ والعودة إلى الله بداية جديدة.","q"],
    ["كعب بن مالك رضي الله عنه","تخلّف كعب عن غزوة تبوك دون عذر، ثم صدق النبي ﷺ ولم يلجأ للتبرير، ومرّ بابتلاء شديد حتى تاب الله عليه. (سورة التوبة 117-119، والبخاري ومسلم)","","لا تعالج تقصيرك بإنكاره، بل واجهه بالصدق والعمل والتوبة.","w"],
    ["الرجل الذي قتل مائة نفس","رجل قتل تسعاً وتسعين نفساً ثم سأل عن التوبة، وأكمل المائة، لكنه لم ييأس من رحمة الله فسعى إلى التوبة وقبضته الملائكة وهو في الطريق إليها. (البخاري ومسلم)","","مهما ابتعد الإنسان، لا ينبغي أن يغلق على نفسه باب الرجوع إلى الله.","w"],
    ["سبب نزول: ﴿قل يا عبادي الذين أسرفوا﴾","أن ناساً قد أسرفوا في الذنوب قبل الإسلام، فسألوا النبي ﷺ: هل لنا من توبة؟ فنزلت الآية تفتح لهم باب الأمل. (رواه البخاري)","","رحمة الله أوسع من كل ذنب.","s"]],
 d:[["رَبَّنَا ظَلَمْنَا أَنفُسَنَا وَإِن لَّمْ تَغْفِرْ لَنَا وَتَرْحَمْنَا لَنَكُونَنَّ مِنَ الْخَاسِرِينَ","q","الأعراف: 23"],["رَبِّ اغْفِرْ لِي وَتُبْ عَلَيَّ إِنَّكَ أَنْتَ التَّوَّابُ الرَّحِيمُ","n","سنن أبي داود والترمذي"],["اللَّهُمَّ أَعِنِّي عَلَى ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ عِبَادَتِكَ","n","سنن أبي داود"],["اللَّهُمَّ إِنِّي أَسْأَلُكَ الْهُدَى وَالتُّقَى وَالْعَفَافَ وَالْغِنَى","n","صحيح مسلم"],["اللَّهُمَّ اغْفِرْ لِي مَا قَدَّمْتُ وَمَا أَخَّرْتُ، وَمَا أَسْرَرْتُ وَمَا أَعْلَنْتُ، وَمَا أَنْتَ أَعْلَمُ بِهِ مِنِّي","n","صحيح مسلم"],["اللَّهُمَّ رُدَّنِي إِلَيْكَ رَدًّا جَمِيلًا","s",""]],

{v:["﴿وَلَا تَهِنُوا وَلَا تَحْزَنُوا﴾|آل عمران: 139","﴿فَإِذَا فَرَغْتَ فَانصَبْ ۝ وَإِلَىٰ رَبِّكَ فَارْغَب﴾|الشرح: 7-8","﴿وَأَن لَّيْسَ لِلْإِنسَانِ إِلَّا مَا سَعَىٰ﴾|النجم: 39","﴿إِنَّ اللَّهَ لَا يُضِيعُ أَجْرَ الْمُحْسِنِينَ﴾|التوبة: 120","﴿وَالَّذِينَ جَاهَدُوا فِينَا لَنَهْدِيَنَّهُمْ سُبُلَنَا﴾|العنكبوت: 69","﴿فَاسْتَبِقُوا الْخَيْرَاتِ﴾|البقرة: 148","﴿وَاسْتَعِينُوا بِالصَّبْرِ وَالصَّلَاةِ﴾|البقرة: 45","﴿إِنَّ اللَّهَ مَعَ الصَّابِرِينَ﴾|البقرة: 153","﴿وَلَا تَيْأَسُوا مِن رَّوْحِ اللَّهِ﴾|يوسف: 87","﴿إِنَّ سَعْيَكُمْ لَشَتَّىٰ﴾|الليل: 4","﴿فَمَن يَعْمَلْ مِنَ الصَّالِحَاتِ وَهُوَ مُؤْمِنٌ فَلَا كُفْرَانَ لِسَعْيِهِ﴾|الأنبياء: 94","﴿فَاسْتَقِمْ كَمَا أُمِرْتَ﴾|هود: 112","﴿إِنَّ مَعَ الْعُسْرِ يُسْرًا﴾|الشرح: 6","﴿وَمَا تَوْفِيقِي إِلَّا بِاللَّهِ﴾|هود: 88","﴿وَأَقِمِ الصَّلَاةَ لِذِكْرِي﴾|طه: 14","﴿وَقُل رَّبِّ زِدْنِي عِلْمًا﴾|طه: 114"],
 s:[["نوح عليه السلام: الاستمرار رغم طول الطريق","دعا قومه ليلاً ونهاراً واستمر في دعوتهم زمناً طويلاً جداً.","﴿قَالَ رَبِّ إِنِّي دَعَوْتُ قَوْمِي لَيْلًا وَنَهَارًا﴾|نوح: 5","ليس كل جهد تظهر نتيجته سريعاً، وليس كل نجاح من أول محاولة.","q"],
    ["موسى عليه السلام: من الخوف إلى المواجهة","خاف موسى من مواجهة فرعون، لكنه مضى مستعيناً بالله.","﴿قَالَ كَلَّا إِنَّ مَعِيَ رَبِّي سَيَهْدِينِ﴾|الشعراء: 62","الشجاعة ليست غياب الخوف، بل الاستمرار مع الاستعانة بالله.","q"],
    ["ذو القرنين: العمل والأخذ بالأسباب","حين واجه مشكلة يأجوج ومأجوج لم يكتفِ بالدعاء، بل عمل وأخذ بالأسباب وسخّر الإمكانات المتاحة. (الكهف 83-98)","","التوكل لا يعني انتظار التغيير دون عمل.","q"]],
 d:[["اللَّهُمَّ إِنِّي أَسْأَلُكَ الْهُدَى وَالتُّقَى وَالْعَفَافَ وَالْغِنَى","n","صحيح مسلم"],["اللَّهُمَّ أَعِنِّي عَلَى ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ عِبَادَتِكَ","n","سنن أبي داود"],["اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْعَجْزِ وَالْكَسَلِ","n","صحيح البخاري"],["اللَّهُمَّ ارْزُقْنِي هِمَّةً عَالِيَةً، وَنَفْسًا مُطْمَئِنَّةً، وَعَمَلًا صَالِحًا مُتَقَبَّلًا","s",""],["رَبَّنَا أَفْرِغْ عَلَيْنَا صَبْرًا وَثَبِّتْ أَقْدَامَنَا","q","البقرة: 250"],["اللَّهُمَّ لَا تَجْعَلْنِي مِمَّنْ يَعْرِفُونَ الطَّرِيقَ ثُمَّ يَتَكَاسَلُونَ عَنِ السَّيْرِ فِيهِ","s",""]],

{v:["﴿لَئِن شَكَرْتُمْ لَأَزِيدَنَّكُمْ﴾|إبراهيم: 7","﴿فَاذْكُرُونِي أَذْكُرْكُمْ وَاشْكُرُوا لِي وَلَا تَكْفُرُونِ﴾|البقرة: 152","﴿اعْمَلُوا آلَ دَاوُودَ شُكْرًا وَقَلِيلٌ مِّنْ عِبَادِيَ الشَّكُورُ﴾|سبأ: 13","﴿وَإِن تَعُدُّوا نِعْمَتَ اللَّهِ لَا تُحْصُوهَا﴾|إبراهيم: 34","﴿وَمَا بِكُم مِّن نِّعْمَةٍ فَمِنَ اللَّهِ﴾|النحل: 53","﴿وَأَمَّا بِنِعْمَةِ رَبِّكَ فَحَدِّثْ﴾|الضحى: 11","﴿وَسَيَجْزِي اللَّهُ الشَّاكِرِينَ﴾|آل عمران: 144","﴿إِنَّ اللَّهَ لَذُو فَضْلٍ عَلَى النَّاسِ وَلَٰكِنَّ أَكْثَرَ النَّاسِ لَا يَشْكُرُونَ﴾|البقرة: 243","﴿كُلُوا مِن رِّزْقِ رَبِّكُمْ وَاشْكُرُوا لَهُ﴾|سبأ: 15","﴿وَاشْكُرُوا نِعْمَتَ اللَّهِ إِن كُنتُمْ إِيَّاهُ تَعْبُدُونَ﴾|النحل: 114","﴿إِنَّ فِي ذَٰلِكَ لَآيَاتٍ لِّكُلِّ صَبَّارٍ شَكُورٍ﴾|إبراهيم: 5","﴿وَلَقَدْ آتَيْنَا لُقْمَانَ الْحِكْمَةَ أَنِ اشْكُرْ لِلَّهِ وَمَن يَشْكُرْ فَإِنَّمَا يَشْكُرُ لِنَفْسِهِ﴾|لقمان: 12","﴿وَهُوَ الَّذِي أَنشَأَ لَكُمُ السَّمْعَ وَالْأَبْصَارَ وَالْأَفْئِدَةَ قَلِيلًا مَّا تَشْكُرُونَ﴾|المؤمنون: 78"],
 s:[["سليمان عليه السلام والنملة","حين سمع سليمان النملة تحذّر قومها أدرك نعمة الله عليه فدعا ربه.","﴿رَبِّ أَوْزِعْنِي أَنْ أَشْكُرَ نِعْمَتَكَ الَّتِي أَنْعَمْتَ عَلَيَّ وَعَلَىٰ وَالِدَيَّ وَأَنْ أَعْمَلَ صَالِحًا تَرْضَاهُ﴾|النمل: 19","كلما زادت نعمك، زادت حاجتك إلى الشكر.","q"],
    ["داود وسليمان عليهما السلام","آتاهما الله العلم والملك والقدرة، ومع ذلك علما أن الفضل كله من الله.","﴿الْحَمْدُ لِلَّهِ الَّذِي فَضَّلَنَا عَلَىٰ كَثِيرٍ مِّنْ عِبَادِهِ الْمُؤْمِنِينَ﴾|النمل: 15","النجاح الحقيقي أن تنسب الفضل إلى صاحبه.","q"],
    ["النبي ﷺ والقيام من الليل","كان النبي ﷺ يقوم الليل حتى تتفطر قدماه، فقيل له: أتفعل هذا وقد غفر الله لك ما تقدم من ذنبك وما تأخر؟ فقال: «أفلا أكون عبداً شكوراً؟» (متفق عليه)","","الشكر ليس مجرد كلمات، بل يظهر في العمل والطاعة.","w"]],
 d:[["رَبِّ أَوْزِعْنِي أَنْ أَشْكُرَ نِعْمَتَكَ الَّتِي أَنْعَمْتَ عَلَيَّ وَعَلَىٰ وَالِدَيَّ","q","النمل: 19"],["اللَّهُمَّ أَعِنِّي عَلَى ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ عِبَادَتِكَ","n","سنن أبي داود"],["اللَّهُمَّ لَكَ الْحَمْدُ حَتَّى تَرْضَى، وَلَكَ الْحَمْدُ إِذَا رَضِيتَ، وَلَكَ الْحَمْدُ بَعْدَ الرِّضَا","s",""],["اللَّهُمَّ مَا أَصْبَحَ بِي مِنْ نِعْمَةٍ أَوْ بِأَحَدٍ مِنْ خَلْقِكَ فَمِنْكَ وَحْدَكَ لَا شَرِيكَ لَكَ، فَلَكَ الْحَمْدُ وَلَكَ الشُّكْرُ","n","سنن أبي داود"],["اللَّهُمَّ اجْعَلْنِي مِنْ عِبَادِكَ الشَّاكِرِينَ، وَلَا تَجْعَلْنِي مِمَّنْ يَنْسَوْنَ نِعَمَكَ","s",""],["اللَّهُمَّ ارْزُقْنِي قَلْبًا شَاكِرًا، وَلِسَانًا ذَاكِرًا، وَعَمَلًا صَالِحًا مُتَقَبَّلًا","s",""]],

 ui:{title:"سَنَد",tag:"رفيقك في كل خطوة",hi:"أهلاً يا {n} 🌙",adT:"📖 آية اليوم",adS:"بتتغير كل يوم بإذن الله",hT:"💙 كيف حال قلبك الليلة؟",hS:"اختار شعورك هسي، وخلي الباقي على الله ثم علينا",shuf:"🔄 جرعة طمأنينة تانية",sabab:"💡 سبب النزول",seerah:"📖 ومضة من السيرة",iT:"✨ أثر اليوم",iS:"تحدي خير بسيط يترك بصمة في يومك ويوم غيرك",go:"أتممت الأثر ✨",ok:"تقبل الله منك يا بطل 🤍",sw:"تغيير",days:"أيام",dT:"أهلاً بيك في سَنَد",dS:"سجّل اسمك وإيميلك عشان نحفظ تقدمك. (ما في كلمة سر ولا سيرفر).",nm:"اسمك",em:"الإيميل (اختياري)",dN:"🔒 البيانات بتتخزن في جهازك بس، وما بتتبعت لأي مكان.",save:"ابدأ",guest:"ادخل كضيف",out:"حذف بياناتي"},
 m:[["ما مطلوب منك تحل كل مشاكل الدنيا الليلة يا صاحبي؛ خد نفس عميق واعمل العليك والباقي على الله.","","لما نزلت آية ﴿وإن تبدوا ما في أنفسكم أو تخفوه يحاسبكم به الله﴾ خاف الصحابة خوف شديد وجاو للنبي ﷺ، فنزلت الآية دي تخفيف ورحمة عليهم. (رواه مسلم)",""],
  ["عادي تخاف من بكرة، بس ما تخلي الخوف يسرق طمأنينة اللحظة دي. اللي رتّب ليك أمورك لحد الليلة مستحيل يضيعك بكرة.","","في غار ثور والمشركين واقفين فوق راس الغار، أبو بكر خاف على النبي ﷺ، فقال ليهو بهدوء: (لا تحزن إن الله معنا). اليقين بالله بيحول الخوف لسكينة.",""],
  ["عادي جداً تحزن، حتى الأنبياء حزنوا. ربنا شايف تقلك وعارف الوجع الجواك من غير ما تنطق.","","أبطأ الوحي على النبي ﷺ فترة، فقالت امرأة كلمة جارحة، فنزلت سورة الضحى تطبطب على قلبو وتوعدو بعطاء يرضيه. (متفق عليه)",""],
  ["إنك تحس بالتقصير دي علامة إن قلبك حي. باب التوبة عمرو ما اتقفل في وش زول جا بصدق.","","ناس كانوا أسرفوا في الذنوب قبل الإسلام وسألوا النبي ﷺ: هل لينا توبة؟ فنزلت الآية دي تفتح ليهم باب الأمل. (رواه البخاري)",""],
  ["الشغف بيجي ويمشي، لكن الاستمرار ولو بخطوة صغيرة هو البيصنع الفرق. ابدأ بأبسط حاجة لمدة 5 دقائق بس.","","بعد ما رده أهل الطائف ورموه بالحجارة، ما استسلم النبي ﷺ وكمّل دعوتو بصبر. والله وعد: الجاهد بيتهدى.",""],
  ["فرحتك دي رزق عظيم، وشكر النعمة هو السر البيخليها تدوم وتزيد. شارك سعادتك مع زول بتحبو.","","كان النبي ﷺ يقوم الليل لين تتورم قدماه، فسألتو عائشة: ليه وقد غُفر لك؟ قال: (أفلا أكون عبداً شكوراً؟). (متفق عليه)",""]],
 ch:["أرسل رسالة لصاحبك ما اتكلمت معاهو من فترة وقول ليهو: (اتذكرتك وحبيت أطمن عليك).","ابتسم في وش أي زول تقابله الليلة واديهو سلام دافئ من القلب.","اقعد مع أمك أو أبوك 15 دقيقة بدون تلفون واسمع ليهم.","شارك ملخص أو معلومة مفيدة مع زميلك المحتاج ليها.","ادعي لزول بتحبه في ظهر الغيب دعوة صادقة.","شيل أي أذى من الطريق (حجر، قزاز، كيس) واحتسب أجرو عند الله."],
 emo:["مضغوط ومتشتت","خايف من الجاي","مخنوق وحزين","حاسس بتقصير","فاقد الشغف","مبسوط وممتن"]},

 m:[["لا يُطلب منك أن تحلّ كل مشكلات الدنيا الليلة؛ خذ نفساً عميقاً وافعل ما تستطيع، والباقي على الله.","","لمّا نزلت آية ﴿وإن تبدوا ما في أنفسكم أو تخفوه يحاسبكم به الله﴾ اشتدّ ذلك على الصحابة وأتوا النبي ﷺ، فنزلت هذه الآية تخفيفاً ورحمة. (رواه مسلم)",""],
  ["من الطبيعي أن تقلق من الغد، لكن لا تدع القلق يسرق سكينة لحظتك. من رعاك إلى الآن لن يضيّعك غداً.","","في غار ثور والمشركون على بابه، خاف أبو بكر على النبي ﷺ فقال له بثبات: (لا تحزن إن الله معنا). اليقين بالله يحوّل الخوف إلى سكينة.",""],
  ["لا بأس أن تحزن، فحتى الأنبياء حزنوا. والله يرى ثقل ما تحمله ويعلم وجعك وإن لم تنطق.","","أبطأ الوحي على النبي ﷺ مدة، فقالت امرأة كلمة جارحة، فنزلت سورة الضحى تُطمئن قلبه وتعده بعطاء يرضيه. (متفق عليه)",""],
  ["شعورك بالتقصير علامة حياة قلبك. وباب التوبة لا يُغلق في وجه صادق.","","كان أناس قد أسرفوا في الذنوب قبل الإسلام فسألوا النبي ﷺ: هل لنا من توبة؟ فنزلت الآية تفتح لهم باب الأمل. (رواه البخاري)",""],
  ["الشغف يأتي ويذهب، لكن المداومة ولو بخطوة صغيرة هي ما يصنع الفرق. ابدأ بأبسط شيء خمس دقائق فقط.","","بعد أن ردّه أهل الطائف ورمَوه بالحجارة لم ييأس النبي ﷺ، وواصل دعوته بصبر. ووعد الله المجاهدين بالهداية.",""],
  ["فرحتك رزق عظيم، والشكر سرّ دوام النعمة وزيادتها. شارك سعادتك مع من تحب.","","كان النبي ﷺ يقوم الليل حتى تتورّم قدماه، فسألته عائشة: لِمَ وقد غُفر لك؟ قال: (أفلا أكون عبداً شكوراً؟). (متفق عليه)",""]],
 ch:["راسل صديقاً لم تكلّمه منذ مدة وقل له: (تذكّرتك وأحببت أن أطمئن عليك).","ابتسم في وجه كل من تقابله اليوم وألقِ عليه السلام بودّ.","اجلس مع والديك ربع ساعة دون هاتف واستمع إليهما.","شارك ملخصاً أو فائدة مع زميل يحتاجها.","ادعُ لمن تحب بظهر الغيب دعوة صادقة.","أزل أذى من الطريق واحتسب الأجر عند الله."],

 ui:{title:"Sanad",tag:"Your companion at every step",hi:"Welcome, {n} 🌙",adT:"📖 Ayah of the Day",adS:"Renewed every day, God willing",hT:"💙 How is your heart tonight?",hS:"Pick how you feel, and let comfort find you",shuf:"🔄 Another dose of peace",sabab:"💡 Reason of Revelation",seerah:"📖 A Glimpse from the Seerah",iT:"✨ Impact of the Day",iS:"A small act of kindness that leaves a lasting mark",go:"Done for today ✨",ok:"May Allah accept it 🤍",sw:"Swap",days:"days",dT:"Welcome to Sanad",dS:"Add your name and email so we can keep your progress. (No password, no server.)",nm:"Your name",em:"Email (optional)",dN:"🔒 Your data stays on this device only and is never sent anywhere.",save:"Start",guest:"Continue as guest",out:"Delete my data"},
 m:[["You don’t have to solve everything tonight. Take a deep breath, do what you can, and leave the rest to Allah.","“Allah does not burden a soul beyond its capacity.”","When the verse “Whether you show what is within yourselves or hide it, Allah will call you to account” came down, the Companions were deeply distressed and came to the Prophet ﷺ. This verse then followed as relief and mercy. (Muslim)","O Allah, nothing is easy except what You make easy; and You can make grief easy if You will."],
  ["It’s okay to worry about tomorrow, just don’t let it steal the peace of this moment. The One who carried you here won’t abandon you.","“Do not grieve; indeed Allah is with us.”","In the Cave of Thawr, with his enemies right outside, Abu Bakr feared for the Prophet ﷺ, who calmly told him: “Do not grieve; Allah is with us.” Certainty turns fear into serenity.","Allah is sufficient for us, and He is the best Disposer of affairs."],
  ["It’s okay to feel heavy-hearted; even the Prophets did. Allah sees the weight you carry silently.","“And your Lord is going to give you, and you will be satisfied.”","Revelation paused for a while, and a woman made a hurtful remark to the Prophet ﷺ. Surah Ad-Duha was then revealed to console his heart with a promise of contentment. (Bukhari & Muslim)","O Allah, I seek refuge in You from worry and grief."],
  ["Feeling you’ve fallen short is a sign your heart is alive. The door of return never closes before the sincere.","“Say: O My servants who have transgressed against themselves, do not despair of the mercy of Allah.”","Some people who had sinned heavily before Islam asked the Prophet ﷺ whether they could still be forgiven. This verse came down and opened the door of hope. (Bukhari)","My Lord, forgive me and accept my repentance; You are the Ever-Accepting, the Merciful."],
  ["Motivation comes and goes, but small steady steps make the difference. Start with just 5 minutes of the simplest thing.","“Those who strive for Us, We will surely guide them to Our ways.”","After the people of Ta’if rejected him and threw stones, the Prophet ﷺ did not give up and carried on patiently. Allah promised guidance to those who strive.","O Allah, I seek refuge in You from incapacity and laziness."],
  ["Your joy is a great blessing, and gratitude is what makes it last and grow. Share your happiness with someone you love.","“If you are grateful, I will surely increase you.”","The Prophet ﷺ would pray at night until his feet swelled. Aisha asked why, since he was forgiven. He said: “Shall I not be a grateful servant?” (Agreed upon)","O Allah, help me to remember You, thank You, and worship You well."]],
 ch:["Message a friend you haven’t spoken to in a while: “I thought of you and wanted to check in.”","Smile and greet warmly everyone you meet today.","Spend 15 phone-free minutes with your parents or family.","Share a summary or useful tip with someone who needs it.","Make a sincere, secret prayer for someone you love.","Remove something harmful from the road and hope for Allah’s reward."],
 emo:["Overwhelmed","Anxious","Heavy-hearted","Feeling I fell short","Unmotivated","Grateful"]},
fr:{n:"🇫🇷 Français",d:"ltr",loc:"fr",
 ui:{title:"Sanad",tag:"Votre compagnon à chaque pas",hi:"Bienvenue, {n} 🌙",adT:"📖 Verset du jour",adS:"Renouvelé chaque jour, incha’Allah",hT:"💙 Comment va votre cœur ce soir ?",hS:"Choisissez votre ressenti, le réconfort viendra",shuf:"🔄 Une autre dose de paix",sabab:"💡 Circonstance de la révélation",seerah:"📖 Un éclat de la Sîra",iT:"✨ Impact du jour",iS:"Un petit geste de bonté qui laisse une trace",go:"C’est fait ✨",ok:"Qu’Allah l’accepte 🤍",sw:"Changer",days:"jours",dT:"Bienvenue sur Sanad",dS:"Ajoutez votre nom et e-mail pour garder votre progression. (Sans mot de passe ni serveur.)",nm:"Votre nom",em:"E-mail (facultatif)",dN:"🔒 Vos données restent sur cet appareil et ne sont envoyées nulle part.",save:"Commencer",guest:"Continuer en invité",out:"Supprimer mes données"},
 m:[["Vous n’avez pas à tout résoudre ce soir. Respirez profondément, faites ce que vous pouvez, le reste appartient à Allah.","« Allah n’impose à aucune âme une charge supérieure à sa capacité. »","Quand le verset « Que vous divulguiez ce qui est en vous ou que vous le cachiez, Allah vous en demandera compte » est descendu, les Compagnons furent très inquiets et vinrent voir le Prophète ﷺ. Ce verset est venu comme allègement et miséricorde. (Muslim)","Ô Allah, rien n’est facile sauf ce que Tu rends facile ; et Tu rends la peine facile si Tu le veux."],
  ["Il est normal de s’inquiéter du lendemain, mais ne laissez pas l’inquiétude voler la paix de l’instant. Celui qui vous a mené jusqu’ici ne vous abandonnera pas.","« Ne t’afflige pas, car Allah est avec nous. »","Dans la grotte de Thawr, ses ennemis juste dehors, Abou Bakr craignit pour le Prophète ﷺ, qui lui dit calmement : « Ne t’afflige pas, Allah est avec nous. » La certitude transforme la peur en sérénité.","Allah nous suffit, Il est le meilleur garant."],
  ["Avoir le cœur lourd est humain, même les Prophètes l’ont vécu. Allah voit le poids que vous portez en silence.","« Ton Seigneur te donnera bientôt de quoi te satisfaire. »","La révélation s’interrompit un temps et une femme fit une remarque blessante au Prophète ﷺ. La sourate Ad-Douha descendit alors pour apaiser son cœur par une promesse de satisfaction. (Boukhari et Muslim)","Ô Allah, je cherche refuge auprès de Toi contre le souci et le chagrin."],
  ["Se sentir en manque est le signe d’un cœur vivant. La porte du repentir ne se ferme jamais devant le sincère.","« Dis : Ô Mes serviteurs qui avez commis des excès, ne désespérez pas de la miséricorde d’Allah. »","Des gens qui avaient beaucoup péché avant l’islam demandèrent au Prophète ﷺ s’ils pouvaient encore être pardonnés. Ce verset est descendu et leur a ouvert la porte de l’espoir. (Boukhari)","Mon Seigneur, pardonne-moi et accepte mon repentir ; Tu es Celui qui accepte le repentir, le Miséricordieux."],
  ["La motivation va et vient, mais les petits pas réguliers font la différence. Commencez par 5 minutes de la chose la plus simple.","« Ceux qui luttent pour Nous, Nous les guiderons certes vers Nos chemins. »","Après le rejet et les pierres des gens de Ta’if, le Prophète ﷺ n’a pas abandonné et a poursuivi avec patience. Allah promet la guidée à ceux qui s’efforcent.","Ô Allah, je cherche refuge auprès de Toi contre l’impuissance et la paresse."],
  ["Votre joie est un grand bienfait, et la gratitude la fait durer et croître. Partagez votre bonheur avec un proche.","« Si vous êtes reconnaissants, Je vous donnerai davantage. »","Le Prophète ﷺ priait la nuit jusqu’à ce que ses pieds enflent. Aïcha lui demanda pourquoi, puisqu’il était pardonné. Il répondit : « Ne serai-je pas un serviteur reconnaissant ? » (Accordé)","Ô Allah, aide-moi à T’invoquer, à Te remercier et à bien T’adorer."]],
 ch:["Écrivez à un ami que vous n’avez pas contacté depuis longtemps : « J’ai pensé à toi. »","Souriez et saluez chaleureusement chaque personne croisée aujourd’hui.","Passez 15 minutes sans téléphone avec vos parents ou votre famille.","Partagez un résumé ou un conseil utile avec quelqu’un qui en a besoin.","Faites une invocation sincère et secrète pour un proche.","Retirez un danger du chemin et espérez la récompense d’Allah."],
 emo:["Submergé","Anxieux","Le cœur lourd","En manque","Sans motivation","Reconnaissant"]},

 ui:{title:"Sanad",tag:"Sahabatmu di setiap langkah",hi:"Selamat datang, {n} 🌙",adT:"📖 Ayat Hari Ini",adS:"Diperbarui setiap hari, insyaAllah",hT:"💙 Bagaimana hatimu malam ini?",hS:"Pilih perasaanmu, biarkan ketenangan datang",shuf:"🔄 Dosis ketenangan lain",sabab:"💡 Sebab Turunnya Ayat",seerah:"📖 Cuplikan Sirah",iT:"✨ Jejak Kebaikan Hari Ini",iS:"Kebaikan kecil yang meninggalkan bekas",go:"Sudah kulakukan ✨",ok:"Semoga Allah menerimanya 🤍",sw:"Ganti",days:"hari",dT:"Selamat datang di Sanad",dS:"Isi nama dan email agar progresmu tersimpan. (Tanpa kata sandi dan server.)",nm:"Namamu",em:"Email (opsional)",dN:"🔒 Datamu hanya tersimpan di perangkat ini dan tidak dikirim ke mana pun.",save:"Mulai",guest:"Lanjut sebagai tamu",out:"Hapus data saya"},
 m:[["Kamu tidak harus menyelesaikan semuanya malam ini. Tarik napas dalam, lakukan yang bisa, sisanya serahkan kepada Allah.","“Allah tidak membebani seseorang melainkan sesuai kesanggupannya.”","Ketika turun ayat “Jika kamu tampakkan apa yang ada di dalam hatimu atau kamu sembunyikan, Allah akan memperhitungkannya”, para sahabat sangat resah dan datang kepada Nabi ﷺ. Maka turunlah ayat ini sebagai keringanan dan rahmat. (HR. Muslim)","Ya Allah, tiada yang mudah kecuali yang Engkau mudahkan; dan Engkau dapat memudahkan kesedihan jika Engkau kehendaki."],
  ["Wajar cemas akan esok, tetapi jangan biarkan ia mencuri ketenangan saat ini. Yang membawamu sampai sini tidak akan menelantarkanmu.","“Jangan bersedih, sesungguhnya Allah bersama kita.”","Di Gua Tsur, saat musuh berada di luar, Abu Bakar khawatir akan Nabi ﷺ, lalu beliau berkata dengan tenang: “Jangan bersedih, Allah bersama kita.” Keyakinan mengubah takut menjadi tenang.","Cukuplah Allah bagi kami, Dialah sebaik-baik pelindung."],
  ["Wajar jika hati terasa berat, para Nabi pun mengalaminya. Allah melihat beban yang kamu pikul dalam diam.","“Dan kelak Tuhanmu pasti memberimu hingga engkau puas.”","Wahyu sempat terhenti beberapa waktu, lalu seorang perempuan mengucapkan kata menyakitkan kepada Nabi ﷺ. Maka turun Surah Ad-Dhuha untuk menenangkan hati beliau. (HR. Bukhari dan Muslim)","Ya Allah, aku berlindung kepada-Mu dari kesusahan dan kesedihan."],
  ["Merasa kurang adalah tanda hatimu hidup. Pintu taubat tidak pernah tertutup bagi yang tulus.","“Katakanlah: Wahai hamba-hamba-Ku yang melampaui batas, jangan berputus asa dari rahmat Allah.”","Sekelompok orang yang banyak berdosa sebelum Islam bertanya kepada Nabi ﷺ apakah masih ada taubat bagi mereka. Maka turun ayat ini membuka pintu harapan. (HR. Bukhari)","Tuhanku, ampunilah aku dan terimalah taubatku; Engkau Maha Penerima taubat lagi Maha Penyayang."],
  ["Semangat datang dan pergi, tetapi langkah kecil yang konsisten membuat perbedaan. Mulailah 5 menit dengan hal paling sederhana.","“Orang-orang yang berjuang di jalan Kami, pasti Kami tunjukkan jalan-jalan Kami.”","Setelah ditolak dan dilempari batu oleh penduduk Thaif, Nabi ﷺ tidak menyerah dan terus berdakwah dengan sabar. Allah menjanjikan petunjuk bagi yang bersungguh-sungguh.","Ya Allah, aku berlindung kepada-Mu dari lemah dan malas."],
  ["Kebahagiaanmu adalah nikmat besar, dan syukur membuatnya bertahan dan bertambah. Bagikan bahagiamu kepada orang tersayang.","“Jika kamu bersyukur, pasti Aku akan menambah (nikmat) kepadamu.”","Nabi ﷺ shalat malam hingga kedua kakinya bengkak. Aisyah bertanya mengapa, padahal beliau telah diampuni. Beliau menjawab: “Tidakkah aku ingin menjadi hamba yang bersyukur?” (Muttafaq ‘alaih)","Ya Allah, bantulah aku untuk berzikir, bersyukur, dan beribadah dengan baik kepada-Mu."]],
 ch:["Kirim pesan ke teman yang lama tidak kamu hubungi: “Aku teringat kamu.”","Tersenyum dan sapa hangat setiap orang yang kamu temui hari ini.","Habiskan 15 menit tanpa ponsel bersama orang tua atau keluarga.","Bagikan ringkasan atau tips berguna kepada yang membutuhkan.","Doakan seseorang yang kamu sayangi secara diam-diam.","Singkirkan gangguan dari jalan dan niatkan pahala dari Allah."],
 emo:["Kewalahan","Cemas","Hati terasa berat","Merasa kurang","Kurang semangat","Bersyukur"]}

 vt:{"الرعد: 28":"Surely, in the remembrance of Allah do hearts find rest.","البقرة: 286":"Allah does not burden a soul beyond what it can bear.","ق: 16":"We created man and We know what his soul whispers to him.","الحديد: 4":"And He is with you wherever you are.","الشرح: 5-6":"For indeed, with hardship comes ease. Indeed, with hardship comes ease.","النحل: 127":"Be patient; and your patience is only through Allah.","البقرة: 45":"Seek help through patience and prayer.","الفتح: 4":"He is the One who sent down tranquility into the hearts of the believers.","آل عمران: 139":"Do not weaken and do not grieve, for you will be superior if you are true believers.","آل عمران: 139*":"Do not weaken and do not grieve.","الكهف: 24":"And remember your Lord when you forget.","الشرح: 7-8":"So when you have finished, then stand up [for worship]. And to your Lord direct your longing.","الطلاق: 4":"Whoever fears Allah, He will make his matter easy for him.","يوسف: 64":"And He is the Most Merciful of the merciful.","البقرة: 153":"Indeed, Allah is with the patient.","الشرح: 1":"Did We not expand for you your chest?","طه: 25-26":"My Lord, expand for me my chest and ease my task for me.","الكهف: 10":"Our Lord, grant us mercy from Yourself and prepare for us right guidance in our affair.","التوبة: 40":"Do not grieve; indeed Allah is with us.","البقرة: 216":"But perhaps you dislike a thing and it is good for you.","الطلاق: 3":"And whoever relies upon Allah, then He is sufficient for him.","الأنعام: 59":"And with Him are the keys of the unseen; none knows them except Him.","هود: 6":"And there is no creature on earth but that upon Allah is its provision.","الطلاق: 1":"You do not know; perhaps Allah will bring about after that a [new] matter.","التوبة: 51":"Say: Nothing will ever befall us except what Allah has decreed for us; He is our Protector.","هود: 88":"And my success is only through Allah.","الإسراء: 31":"We provide for them and for you.","يوسف: 100":"Indeed, my Lord is Subtle in what He wills.","طه: 73":"And Allah is better and more enduring.","الزمر: 36":"Is not Allah sufficient for His servant?","هود: 123":"And to Allah belongs the unseen of the heavens and the earth, and to Him the whole matter is returned.","آل عمران: 159":"And when you have decided, then rely upon Allah.","يوسف: 87":"And do not despair of relief from Allah.","النساء: 81":"And sufficient is Allah as Disposer of affairs.","الفرقان: 58":"And rely upon the Ever-Living who does not die.","القصص: 13":"So We returned him to his mother that her eyes might be comforted and she not grieve.","إبراهيم: 37":"Our Lord, I have settled some of my descendants in a valley without cultivation.","يوسف: 86":"I only complain of my suffering and my grief to Allah.","الضحى: 3":"Your Lord has not taken leave of you, nor has He detested [you].","الضحى: 5":"And your Lord is going to give you, and you will be satisfied.","البقرة: 155":"And give good tidings to the patient.","الشرح: 6":"Indeed, with hardship comes ease.","الطور: 48":"Be patient for the decision of your Lord, for indeed, you are in Our eyes.","الشورى: 28":"And it is He who sends down the rain after they have despaired.","البقرة: 186":"Indeed I am near; I respond to the call of the caller when he calls upon Me.","الحجر: 97":"We know that your chest is tightened by what they say.","الحجر: 98":"So exalt Allah with praise of your Lord and be among those who prostrate.","النمل: 70":"And do not grieve over them and do not be in distress over what they plot.","الأنبياء: 83":"Indeed, adversity has touched me, and You are the Most Merciful of the merciful.","الأنبياء: 87":"There is no deity except You; exalted are You. Indeed, I have been of the wrongdoers.","مريم: 24":"Do not grieve; your Lord has provided beneath you a stream.","الزمر: 53":"Say: O My servants who have transgressed against themselves, do not despair of the mercy of Allah.","البقرة: 222":"Indeed, Allah loves those who repent and loves those who purify themselves.","الشورى: 25":"And it is He who accepts repentance from His servants.","هود: 61":"Indeed, my Lord is near and responsive.","النساء: 110":"Whoever does a wrong or wrongs himself but then seeks forgiveness of Allah will find Allah Forgiving and Merciful.","هود: 114":"Indeed, good deeds do away with misdeeds.","آل عمران: 135":"Those who, when they commit an immorality or wrong themselves, remember Allah and seek forgiveness for their sins.","الفرقان: 70":"For them Allah will replace their evil deeds with good.","النور: 31":"And turn to Allah in repentance, all of you, O believers, that you might succeed.","النجم: 39":"And that there is not for man except that [good] for which he strives.","التوبة: 105":"And say: Do [as you will], for Allah will see your deeds.","العنكبوت: 69":"And those who strive for Us, We will surely guide them to Our ways.","البقرة: 148":"So race to [all that is] good.","الزلزلة: 7":"So whoever does an atom’s weight of good will see it.","الأعراف: 23":"Our Lord, we have wronged ourselves, and if You do not forgive us and have mercy upon us, we will surely be among the losers.","التوبة: 120":"Indeed, Allah does not allow to be lost the reward of those who do good.","الليل: 4":"Indeed, your efforts are diverse.","الأنبياء: 94":"So whoever does righteous deeds while a believer, there will be no denial of his effort.","هود: 112":"So remain on a right course as you have been commanded.","طه: 14":"And establish prayer for My remembrance.","طه: 114":"And say: My Lord, increase me in knowledge.","نوح: 5":"He said: My Lord, indeed I invited my people night and day.","الشعراء: 62":"[Moses] said: No! Indeed, my Lord is with me; He will guide me.","إبراهيم: 7":"If you are grateful, I will surely increase you [in favor].","البقرة: 152":"So remember Me; I will remember you. And be grateful to Me and do not deny Me.","سبأ: 13":"Work, O family of David, in gratitude; and few of My servants are grateful.","إبراهيم: 34":"And if you should count the favors of Allah, you could not enumerate them.","النحل: 53":"And whatever you have of favor is from Allah.","الضحى: 11":"But as for the favor of your Lord, report [it].","آل عمران: 144":"And Allah will reward the grateful.","البقرة: 243":"Indeed, Allah is bountiful to the people, but most people are not grateful.","سبأ: 15":"Eat from the provision of your Lord and be grateful to Him.","النحل: 114":"And be grateful for the favor of Allah, if it is [indeed] Him that you worship.","إبراهيم: 5":"Indeed in that are signs for everyone patient and grateful.","لقمان: 12":"And We had certainly given Luqman wisdom: ‘Be grateful to Allah.’ And whoever is grateful is grateful for [the benefit of] himself.","المؤمنون: 78":"And it is He who made for you hearing, vision, and hearts; little do you give thanks.","النمل: 19":"My Lord, enable me to be grateful for Your favor which You have bestowed upon me and upon my parents and to do righteous deeds that please You.","النمل: 15":"[All] praise is [due] to Allah, who has favored us over many of His believing servants."},
 s:[
 [["Moses (peace be upon him) Facing a Hard Mission","When Moses was tasked with confronting Pharaoh, he asked Allah to expand his chest and ease his task.","Even when the mission is bigger than you imagined, you can begin by asking Allah for help."],["The People of the Cave","Young men faced a harsh reality and heavy pressure, so they turned to Allah and asked Him for mercy and right guidance.","When you don’t know the way, ask Allah to show it to you."],["The Prophet ﷺ in the Cave","The Prophet ﷺ and Abu Bakr (may Allah be pleased with him) were in the cave with danger close by, and the Prophet ﷺ said words that reassured him.","Circumstances may narrow, but Allah being with you is greater than everything you fear."],["Reason of revelation: “Allah does not burden a soul beyond its capacity”","When the verse “Whether you show what is within yourselves or hide it, Allah will hold you to account for it” was revealed, it weighed heavily on the Companions, who came to the Prophet ﷺ saying they could not bear it. Allah then revealed “Allah does not burden a soul beyond its capacity” as relief for them. (Muslim)","Allah never burdens you beyond your capacity."]],
 [["Joseph (peace be upon him): A Future No One Expected","Joseph was thrown into the well, then sold, then jailed. But the story did not end there: he became the minister of Egypt and was reunited with his family after years apart. (Surah Yusuf)","Do not judge your future by your present; events whose wisdom you can’t see today may be part of a road you never imagined."],["The Mother of Moses (peace be upon him)","She placed her baby in a chest and cast it into the river by Allah’s command, though it looked frightening, and Allah returned him to her.","Allah’s planning for you may be greater than your ability to imagine a way out."],["Abraham (peace be upon him)","Abraham left his family in a barren valley and turned to Allah in supplication.","When you can’t control the circumstances, you can still make du‘a."],["The Prophet ﷺ and Abu Bakr in the Cave","The polytheists stood at the mouth of the cave, and Abu Bakr said: if one of them looked down at his feet he would see us! The Prophet ﷺ said: “What do you think of two whose third is Allah?” (Bukhari)","Certainty in Allah turns fear into calm."]],
 [["Jacob (peace be upon him): Grief That Never Cuts Off Hope","Jacob lost his son Joseph and his grief grew so heavy that his eyes turned white, yet he never lost his trust in Allah.","You don’t have to pretend to be strong all the time; you can take your sorrow to Allah."],["Job (peace be upon him): When Trials Last Long","Job was tested yet stayed attached to his Lord, so Allah answered him and removed his affliction.","A long trial does not mean Allah’s mercy is absent."],["Jonah (peace be upon him): In Three Layers of Darkness","Jonah was in the darkness of the sea, the night, and the belly of the whale, yet he never lost the door of du‘a.","Even at the deepest point of sorrow, Allah’s door stays open."],["Mary (peace be upon her)","When labor pains overwhelmed her and she found herself in a very hard moment, divine reassurance and steadiness came to her.","Mercy may arrive in the very moments when you feel most alone."],["Reason of revelation: Surah Ad-Duha","The Prophet ﷺ was unwell and did not get up for night prayer for a night or two. A woman came and said: “Muhammad, I think your devil has left you!” So Allah revealed “By the morning brightness and the night when it grows still, your Lord has not taken leave of you nor detested you.” (Agreed upon)","Your Lord has not left you and never will."]],
 [["Adam (peace be upon him): A Mistake Is Not the End of the Road","When Adam slipped, he did not persist in turning away; he repented to Allah.","Admitting a mistake and returning to Allah is a fresh beginning."],["Ka‘b ibn Malik (may Allah be pleased with him)","Ka‘b stayed behind from the expedition of Tabuk without an excuse, then told the Prophet ﷺ the truth without making excuses. He passed through a severe trial until Allah accepted his repentance. (Surah At-Tawbah 117-119; Bukhari & Muslim)","Don’t treat your shortcoming by denying it; face it with honesty, action, and repentance."],["The Man Who Killed One Hundred People","A man killed ninety-nine people, then asked whether repentance was possible, and completed the hundred. Yet he did not despair of Allah’s mercy and set out toward repentance; the angels took his soul on the way. (Bukhari & Muslim)","No matter how far a person has gone, he should never shut the door of returning to Allah."],["Reason of revelation: “Say: O My servants who have transgressed”","Some people who had sinned heavily before Islam asked the Prophet ﷺ whether there was repentance for them. This verse came down and opened the door of hope. (Bukhari)","Allah’s mercy is wider than any sin."]],
 [["Noah (peace be upon him): Persisting Despite a Long Road","He called his people night and day and kept calling them for a very long time.","Not every effort shows results quickly, and not every success comes on the first try."],["Moses (peace be upon him): From Fear to Confrontation","Moses feared facing Pharaoh, yet he went forward relying on Allah.","Courage is not the absence of fear, but moving on while seeking Allah’s help."],["Dhul-Qarnayn: Working and Taking the Means","When he faced the problem of Gog and Magog, he did not stop at du‘a; he worked, took the means and used the resources available. (Al-Kahf 83-98)","Trusting Allah does not mean waiting for change without working."]],
 [["Solomon (peace be upon him) and the Ant","When Solomon heard the ant warning her people, he realized Allah’s favor upon him and prayed to his Lord.","The more blessings you have, the more you need gratitude."],["David and Solomon (peace be upon them)","Allah gave them knowledge, kingdom, and power, yet they knew all the credit belongs to Allah.","True success is giving the credit to its Owner."],["The Prophet ﷺ and the Night Prayer","The Prophet ﷺ would stand in prayer at night until his feet swelled. He was asked: “Do you do this though Allah has forgiven your past and future sins?” He said: “Should I not be a grateful servant?” (Agreed upon)","Gratitude is not just words; it shows in action and worship."]]
 ],
 d:[
 [D1,"My Lord, expand my chest and ease my task for me.","O Allah, help me and do not help others against me; support me and do not support others against me; guide me and make guidance easy for me.","O Ever-Living, O Sustainer, in Your mercy I seek relief; set right all my affairs and do not leave me to myself for the blink of an eye.","O Allah, I ask You for ease in the heart, calm in the soul, blessing in time, and facility in affairs."],
 ["O Allah, I ask You for the good of this matter and the good of what follows it, and I seek refuge in You from its evil and the evil of what follows.","O Allah, I submit myself to You and entrust my affairs to You ... there is no refuge or escape from You except to You.","Our Lord, grant us mercy from Yourself and prepare for us right guidance in our affair.","My Lord, I am in need of whatever good You send down to me.","O Allah, I ask You for success and right direction, and that You make my coming days better than those that passed."],
 [D1,"There is no deity except You; exalted are You. Indeed, I have been of the wrongdoers.",D2,"Our Lord, pour upon us patience and cause us to die as Muslims [in submission to You].","Our Lord, let not our hearts deviate after You have guided us, and grant us from Yourself mercy.","Our Lord, give us good in this world and good in the Hereafter, and protect us from the punishment of the Fire.","O Allah, I am Your servant, son of Your servant, son of Your maidservant ... that You make the Qur’an the spring of my heart, the light of my chest, the departure of my sorrow and the relief of my worry."],
 ["Our Lord, we have wronged ourselves, and if You do not forgive us and have mercy upon us, we will surely be among the losers.","My Lord, forgive me and accept my repentance; You are the Accepting of repentance, the Merciful.","O Allah, help me to remember You, thank You, and worship You well.","O Allah, I ask You for guidance, piety, chastity, and self-sufficiency.","O Allah, forgive me what I have done and what I will do, what I concealed and what I declared, and what You know better than I.","O Allah, return me to You in a beautiful way."],
 ["O Allah, I ask You for guidance, piety, chastity, and self-sufficiency.","O Allah, help me to remember You, thank You, and worship You well.","O Allah, I seek refuge in You from incapacity and laziness.","O Allah, grant me high resolve, a tranquil soul, and accepted righteous deeds.","Our Lord, pour upon us patience and make our feet firm.","O Allah, do not make me among those who know the way and then grow lazy about walking it."],
 ["My Lord, enable me to be grateful for Your favor which You have bestowed upon me and upon my parents.","O Allah, help me to remember You, thank You, and worship You well.","O Allah, all praise is Yours until You are pleased, praise is Yours when You are pleased, and praise is Yours after being pleased.","O Allah, whatever blessing has come to me or to any of Your creation this morning is from You alone, with no partner; to You is the praise and to You is the thanks.","O Allah, make me among Your grateful servants and do not make me among those who forget Your blessings.","O Allah, grant me a grateful heart, a remembering tongue, and accepted righteous deeds."]

 msg:["You don’t have to carry everything at once. Take the means and seek Allah’s help.","The future is unseen, and your Lord who knows the unseen is your Lord today as well.","You can tell Allah what you can’t tell anyone.","Don’t let regret over yesterday stop you from repairing today.","Don’t wait to feel like it before you begin; begin with one small step.","Reflect on what you have today; it was once a prayer you asked Allah for."],
